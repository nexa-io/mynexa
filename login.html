<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jwt-simple/0.5.6/jwt-simple.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; display: flex; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; border: 1px solid #f9a8d4; text-align: center; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 to-white min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white border border-pink-200 rounded-2xl p-6 shadow-md">
        <div class="flex items-center space-x-2 mb-6">
            <svg class="w-6 h-6" viewBox="0 0 50 50" fill="none">
                <rect x="10" y="10" width="10" height="10" fill="#ec4899" rx="2"/>
                <rect x="30" y="10" width="10" height="10" fill="#f9a8d4" rx="2"/>
                <rect x="10" y="30" width="10" height="10" fill="#f9a8d4" rx="2"/>
                <rect x="30" y="30" width="10" height="10" fill="#ec4899" rx="2"/>
            </svg>
            <h1 class="text-xl font-bold text-pink-600">NEXA</h1>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Login</h2>
        <div class="space-y-4">
            <input id="email" type="email" placeholder="Email" required class="w-full p-2 border border-pink-200 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-300">
            <input id="password" type="password" placeholder="Password" required class="w-full p-2 border border-pink-200 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-300">
            <button onclick="login()" class="w-full bg-pink-500 text-white p-2 rounded-full hover:bg-pink-600">Login</button>
        </div>
        <p class="mt-4 text-gray-600 text-center">No account? <a href="signup.html" class="text-pink-600 hover:underline">Sign Up</a></p>
    </div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <p id="modal-message" class="text-gray-800 mb-4"></p>
            <button id="modal-close" class="bg-pink-500 text-white px-4 py-1 rounded-full hover:bg-pink-600">OK</button>
        </div>
    </div>
    <script>
        const JWT_SECRET = 'nexa_secure_2025';
        function initDataStore() {
            let dataStore = JSON.parse(localStorage.getItem('nexa_data')) || {
                users: [],
                contracts: [],
                notifications: []
            };
            if (!dataStore.users.find(u => u.email === 'infocontactnexa@gmail.com')) {
                dataStore.users.push({
                    email: 'infocontactnexa@gmail.com',
                    password: bcrypt.hashSync('NexaAdmin2025', 10),
                    name: 'Admin',
                    phone: '',
                    address: '',
                    isAdmin: true
                });
                localStorage.setItem('nexa_data', JSON.stringify(dataStore));
            }
            return dataStore;
        }
        function saveDataStore(dataStore) {
            localStorage.setItem('nexa_data', JSON.stringify(dataStore));
        }
        function showModal(message) {
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal').style.display = 'flex';
        }
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });
        function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const dataStore = initDataStore();
            const user = dataStore.users.find(u => u.email === email);
            if (!user) {
                showModal('User not found');
                return;
            }
            if (!bcrypt.compareSync(password, user.password)) {
                showModal('Incorrect password');
                return;
            }
            const token = jwt.encode({ email: user.email, isAdmin: user.isAdmin }, JWT_SECRET);
            localStorage.setItem('authToken', token);
            window.location.href = user.isAdmin ? 'admin.html' : 'dashboard.html';
        }
    </script>
</body>
</html>
