<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Nexa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Montserrat', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full mx-auto p-8 bg-white rounded-xl shadow-2xl border border-pink-100">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Welcome Back 👋</h2>
    <p class="text-gray-600 text-center mb-6">Log in to continue your profit-sharing journey.</p>

    <form id="loginForm" class="mt-6 space-y-5" novalidate>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" required
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" required
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" />
      </div>

      <button type="submit" id="loginBtn"
        class="w-full bg-pink-500 text-white p-3 rounded-lg font-semibold hover:bg-pink-600 transition-colors">
        Log In
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      Don't have an account? 
      <a href="signup.html" class="text-pink-500 hover:underline font-medium">Sign Up</a>
    </p>
  </div>

  <script>
    const backendUrl = 'https://nexa-backend-3wxt.onrender.com';
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    // Redirect if already logged in
    if (localStorage.getItem('loggedIn') === 'true') {
      window.location.href = 'dashboard.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // ✅ Prevent accidental GET

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert('Please fill in all fields.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
        return;
      }

      try {
        const response = await fetch(`${backendUrl}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.token) {
            localStorage.setItem('authToken', data.token);
          }
          localStorage.setItem('loggedIn', 'true');
          alert('Login successful! Redirecting to your dashboard...');
          window.location.href = 'dashboard.html';
        } else {
          if (response.status === 401) {
            alert('Invalid email or password.');
          } else {
            alert(data.message || 'Login failed. Please try again.');
          }
        }
      } catch (err) {
        console.error('Login error:', err);
        alert('Network error. Please check your connection.');
      } finally {
        loginBtn.textContent = 'Log In';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
