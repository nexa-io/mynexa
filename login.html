<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login - Nexa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow">
    <h2 class="text-2xl font-bold mb-4 text-center">Log In</h2>
    <form id="loginForm" class="space-y-4">
      <input id="email" type="email" placeholder="Email" required class="w-full p-3 border rounded"/>
      <input id="password" type="password" placeholder="Password" required class="w-full p-3 border rounded"/>
      <button type="submit" id="loginBtn" class="w-full bg-pink-500 text-white p-3 rounded">Log In</button>
    </form>
    <p class="mt-4 text-center text-sm">No account? <a href="signup.html" class="text-pink-500">Sign Up</a></p>
  </div>

  <script>
    const backendUrl = 'https://nexa-backend-3wxt.onrender.com';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${backendUrl}/login`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.message || 'Login failed');

        localStorage.setItem('authToken', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('loggedIn', 'true');
        window.location.href = 'dashboard.html';
      } catch {
        alert('Network error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
