<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Times New Roman', Times, serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto p-6 bg-white rounded shadow">
        <h2 class="text-2xl font-bold text-gray-800 text-center">Log In</h2>
        <form id="login-form" class="mt-6 space-y-4">
            <div>
                <label class="block text-gray-600">Email</label>
                <input type="email" id="email" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-gray-600">Password</label>
                <input type="password" id="password" class="w-full p-2 border rounded" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Log In</button>
        </form>
        <p class="mt-4 text-center text-gray-600"><a href="#" class="text-blue-500 hover:underline" onclick="alert('Password reset link sent to your email.')">Forgot Password?</a></p>
        <p class="mt-2 text-center text-gray-600">No account? <a href="signup.html" class="text-blue-500 hover:underline">Sign Up</a></p>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('https://nexa-backend-3wxt.onrender.com/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            if (response.ok) {
                localStorage.setItem('user', JSON.stringify(await response.json()));
                localStorage.setItem('loggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid email or password.');
            }
        });
    </script>
</body>
</html>
