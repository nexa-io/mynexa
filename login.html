<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Log In - Nexa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Montserrat', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-auto p-8 bg-white rounded-xl shadow-2xl border border-pink-100">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Log In</h2>
    <p class="text-gray-600 text-center mb-6">Welcome back.</p>

    <form id="loginForm" class="space-y-4" novalidate>
      <div>
        <label class="block text-sm text-gray-700">Email</label>
        <input id="email" type="email" required class="w-full p-3 border rounded" />
      </div>
      <div>
        <label class="block text-sm text-gray-700">Password</label>
        <input id="password" type="password" required class="w-full p-3 border rounded" />
      </div>

      <button id="loginBtn" type="submit" class="w-full bg-pink-500 text-white p-3 rounded">Log In</button>
    </form>

    <p class="mt-4 text-center text-sm">Don't have an account? <a href="signup.html" class="text-pink-500">Sign up</a></p>
  </div>

  <script>
    const backendUrl = location.origin; // if served from same host; otherwise set full URL
    // Example: const backendUrl = 'https://nexa-backend-3wxt.onrender.com';

    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const resp = await fetch(`${backendUrl}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await resp.json();
        if (!resp.ok) {
          alert(data.message || 'Login failed.');
          return;
        }

        if (data.token) localStorage.setItem('authToken', data.token);
        if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('loggedIn', 'true');

        alert('Login successful — redirecting to dashboard...');
        window.location.href = 'dashboard.html';
      } catch (err) {
        console.error('Login error:', err);
        alert('Network error. Please try again.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
