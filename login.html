<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Nexa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-simple@0.5.6/jwt-simple.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Montserrat', sans-serif; background: linear-gradient(to bottom right, #fce7f3, #fff); }</style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-lg border border-pink-200 max-w-md w-full">
    <h1 class="text-3xl font-bold text-pink-600 text-center mb-6">Nexa Login</h1>
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-gray-700 font-medium">Email</label>
        <input type="email" id="email" class="w-full p-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500" required />
      </div>
      <div>
        <label for="password" class="block text-gray-700 font-medium">Password</label>
        <input type="password" id="password" class="w-full p-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500" required />
      </div>
      <div id="errorMessage" class="text-red-500 text-sm hidden"></div>
      <button type="submit" class="w-full bg-pink-500 text-white p-2 rounded-full hover:bg-pink-600 transition-colors font-semibold">Login</button>
    </form>
    <p class="text-center text-gray-600 mt-4">
      Don't have an account? <a href="signup.html" class="text-pink-500 hover:underline">Sign Up</a>
    </p>
  </div>
  <script>
    (() => {
      const JWT_SECRET = 'nexa_secure_2025';

      function simpleHash(text) {
        let hash = 0;
        for (let i = 0; i < text.length; i++) {
          hash = ((hash << 5) - hash) + text.charCodeAt(i);
          hash |= 0;
        }
        return hash.toString();
      }

      function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = message;
        errorDiv.classList.remove('hidden');
      }

      function hideError() {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.classList.add('hidden');
        errorDiv.textContent = '';
      }

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        hideError();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('Please enter a valid email address.');
          return;
        }
        if (!password || password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }

        let dataStore = JSON.parse(localStorage.getItem('nexa_data')) || { users: [], contracts: [], notifications: [] };
        let user = dataStore.users.find(u => u.email === email);

        if (!user) {
          // Simulate signup for new user
          user = { email, name: email.split('@')[0], password: simpleHash(password) };
          dataStore.users.push(user);
          localStorage.setItem('nexa_data', JSON.stringify(dataStore));
          console.log('New user created:', user);
        } else if (user.password !== simpleHash(password)) {
          showError('Incorrect password.');
          return;
        }

        try {
          const token = jwt.encode({ email: user.email, name: user.name, iat: Math.floor(Date.now() / 1000) }, JWT_SECRET);
          localStorage.setItem('authToken', token);
          console.log('authToken set:', token);
          window.location.href = 'dashboard.html';
        } catch (err) {
          console.error('Error generating token:', err.message);
          showError('Authentication error. Please try again.');
        }
      });
    })();
  </script>
</body>
</html>
