<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Montserrat', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full mx-auto p-8 bg-white rounded-xl shadow-2xl border border-pink-100">
        <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Log In</h2>
        <p class="text-gray-600 text-center mb-6">Welcome back to Nexa — your profit-sharing platform.</p>

        <form id="login-form" class="mt-6 space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" required>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" required>
            </div>
            <button type="submit" id="login-btn" class="w-full bg-pink-500 text-white p-3 rounded-lg font-semibold hover:bg-pink-600 transition-colors">Log In</button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            <a href="#" class="text-pink-500 hover:text-pink-600 hover:underline font-medium" onclick="alert('Password reset is not yet implemented. Please contact support.')">
                Forgot Password?
            </a>
        </p>

        <p class="mt-2 text-center text-sm text-gray-600">
            No account?
            <a href="signup.html" class="text-pink-500 hover:text-pink-600 hover:underline font-medium">Sign Up</a>
        </p>
    </div>

    <script>
        // Redirect if already logged in
        if (localStorage.getItem('loggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginBtn = document.getElementById('login-btn');
            loginBtn.textContent = 'Verifying...';
            loginBtn.disabled = true;

            const credentials = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('https://nexa-backend-3wxt.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentials)
                });

                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 401) {
                        alert('Invalid credentials. Please check your email and password.');
                    } else if (response.status === 400) {
                        alert(data.message || 'Bad request. Please try again.');
                    } else {
                        alert('Server error. Please try again later.');
                    }
                    document.getElementById('password').value = '';
                    return;
                }

                if (data.token) {
                    localStorage.setItem('authToken', data.token);
                }
                localStorage.setItem('loggedIn', 'true');
                window.location.href = 'dashboard.html';

            } catch (error) {
                console.error('Login error:', error);
                alert('An unexpected error occurred. Please try again later.');
            } finally {
                loginBtn.textContent = 'Log In';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
