<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin - Nexa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(to bottom right, #fce7f3, #fff);
    margin: 0; min-height: 100vh; display: flex; overflow-x: hidden; color: #1f2937;
  }
  #sidebar {
    position: fixed; top: 0; left: 0; height: 100vh; width: 240px;
    background: white;
    box-shadow: 2px 0 8px rgb(219 39 119 / 0.15);
    padding: 1.5rem 1rem 2rem; display: flex; flex-direction: column; gap: 2rem;
    transition: width 0.3s ease; z-index: 1000;
  }
  #sidebar.collapsed { width: 70px; }
  #sidebar .logo {
    display: flex; align-items: center; gap: 0.6rem;
  }
  #sidebar.collapsed .logo h1, #sidebar.collapsed nav a span { display: none; }
  #sidebar svg rect { rx: 2; }
  #sidebar h1 { color: #db2777; font-weight: 700; font-size: 1.7rem; user-select: none; }
  nav {
    flex-grow: 1; display: flex; flex-direction: column; gap: 0.75rem;
  }
  nav a, nav button {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.5rem 0.5rem; font-weight: 600; color: #4b5563;
    border: none; background: none; font-family: inherit; cursor: pointer;
    border-radius: 0.5rem; text-decoration: none; white-space: nowrap;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  nav a:hover, nav button:hover {
    background-color: #f9a8d4; color: #db2777;
  }
  #sidebar.collapsed nav a, #sidebar.collapsed nav button { justify-content: center; padding: 0.5rem 0; }
  .nav-icon {
    width: 24px; height: 24px; fill: #4b5563; flex-shrink: 0; transition: fill 0.2s;
  }
  nav a:hover .nav-icon, nav button:hover .nav-icon { fill: #db2777; }
  #toggleSidebar {
    position: fixed; top: 18px; left: 250px; background: #db2777; border: none;
    color: white; width: 38px; height: 38px; cursor: pointer; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgb(219 39 119 / 0.3); transition: left 0.3s ease; z-index: 1100;
  }
  #sidebar.collapsed + #toggleSidebar { left: 82px; }
  #toggleSidebar svg { transition: transform 0.3s ease; }
  #toggleSidebar[aria-pressed="true"] svg { transform: rotate(180deg); }
  main {
    margin-left: 240px; padding: 2.5rem 2rem 3rem;
    transition: margin-left 0.3s ease; flex-grow: 1; min-height: 100vh;
    max-width: calc(100vw - 240px); box-sizing: border-box;
  }
  #sidebar.collapsed ~ main { margin-left: 70px; max-width: calc(100vw - 70px); }
  h2 { color: #1f2937; }
  .card {
    background: white; border-radius: 1.5rem; padding: 2rem; margin-bottom: 2.5rem;
    box-shadow: 0 8px 16px rgb(219 39 119 / 0.15);
  }
  input, select, textarea {
    width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 9999px;
    border: 1px solid #f9a8d4; font-family: inherit;
  }
  textarea { border-radius: 0.5rem; resize: vertical; }
  button {
    background: #db2777; color: white; padding: 0.6rem; border: none; border-radius: 9999px;
    cursor: pointer; font-weight: 600; width: 100%; transition: background-color 0.2s ease;
  }
  button:hover { background: #be185d; }
  .contract {
    border: 1px solid #f9a8d4; border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem;
    color: #374151;
  }
  #modal, #confirmationModal {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1200;
  }
  .modal-content {
    background: white; max-width: 400px; width: 90%; padding: 1.5rem;
    border-radius: 1rem; text-align: center; border: 1px solid #f9a8d4;
    font-weight: 600; color: #db2777;
  }
  #modal-close, #confirmOkBtn, #confirmCancelBtn {
    margin-top: 1rem; padding: 0.5rem 1.5rem; border-radius: 9999px;
    cursor: pointer; font-weight: 700; font-size: 1rem; border: none;
  }
  #modal-close, #confirmOkBtn {
    background: #db2777; color: white; transition: background-color 0.2s ease;
  }
  #modal-close:hover, #confirmOkBtn:hover { background: #be185d; }
  #confirmCancelBtn {
    background: #ddd; color: #db2777; margin-left: 0.5rem;
  }
  #confirmCancelBtn:hover { background: #ccc; }
</style>
</head>
<body>

<aside id="sidebar" aria-label="Admin Sidebar Navigation">
  <div class="logo" aria-label="Nexa Logo">
    <svg width="32" height="32" viewBox="0 0 50 50" fill="none" aria-hidden="true" focusable="false">
      <rect x="10" y="10" width="10" height="10" fill="#ec4899" rx="2"></rect>
      <rect x="30" y="10" width="10" height="10" fill="#f9a8d4" rx="2"></rect>
      <rect x="10" y="30" width="10" height="10" fill="#f9a8d4" rx="2"></rect>
      <rect x="30" y="30" width="10" height="10" fill="#ec4899" rx="2"></rect>
    </svg>
    <h1>NEXA</h1>
  </div>
  <nav>
    <a href="#" aria-current="page" tabindex="0">Admin</a>
    <a href="pricing.html">Pricing</a>
    <a href="contact.html">Contact Support</a>
    <a href="faq.html">FAQ</a>
    <button id="logout" aria-label="Logout">Logout</button>
  </nav>
</aside>
<button id="toggleSidebar" aria-label="Toggle sidebar menu" aria-pressed="false" title="Toggle Menu">
  <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
    <path d="M3 6h18M3 12h18M3 18h18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<main>
  <h2>Admin Panel</h2>

  <section class="card">
    <h3>Add Contract</h3>
    <input id="userEmail" type="email" placeholder="User Email" required />
    <input id="accountSize" type="number" placeholder="Account Size" required />
    <input id="challengeType" type="text" placeholder="Challenge Type" required />
    <input id="contractStatus" type="text" placeholder="Contract Status" required />
    <input id="kycStatus" type="text" placeholder="KYC Status" required />
    <input id="contractExpiry" type="text" placeholder="Contract Expiry" required />
    <input id="payoutDate" type="text" placeholder="Payout Date" required />
    <button id="addContractBtn">Add Contract</button>
  </section>

  <section class="card">
    <h3>Contracts</h3>
    <input id="searchEmail" type="email" placeholder="Search by User Email" />
    <div id="contracts"></div>
  </section>

  <section class="card">
    <h3>Send Notification</h3>
    <input id="notifEmail" type="email" placeholder="User Email" required />
    <textarea id="notifMessage" placeholder="Message" required></textarea>
    <button id="sendNotifBtn">Send Notification</button>
  </section>
</main>

<!-- Confirmation Modal for phase change -->
<div id="confirmationModal" role="alertdialog" aria-modal="true" hidden>
  <div class="modal-content">
    <p id="confirmationMessage"></p>
    <button id="confirmOkBtn">OK</button>
    <button id="confirmCancelBtn">Cancel</button>
  </div>
</div>

<!-- Generic Modal -->
<div id="modal" role="alertdialog" aria-modal="true" hidden>
  <div class="modal-content">
    <p id="modal-message"></p>
    <button id="modal-close">OK</button>
  </div>
</div>

<script>
(() => {
  let dataStore;
  let contractsDiv = document.getElementById('contracts');

  function simpleHash(text) {
    let hash = 0;
    for(let i=0; i < text.length; i++) {
      hash = ((hash << 5) - hash) + text.charCodeAt(i);
      hash |= 0;
    }
    return hash.toString();
  }
  function initDataStore() {
    let ds = JSON.parse(localStorage.getItem('nexa_data')) || {users:[], contracts:[], notifications:[]};
    if (!ds.users.find(u => u.email === 'infocontactnexa@gmail.com')) {
      ds.users.push({
        email: 'infocontactnexa@gmail.com',
        password: simpleHash('Strika001$'),
        name: 'Admin',
        phone: '',
        address: '',
        isAdmin:true
      });
      localStorage.setItem('nexa_data', JSON.stringify(ds));
    }
    return ds;
  }

  // Generic modal
  function showModal(message) {
    const modal = document.getElementById('modal');
    const msg = document.getElementById('modal-message');
    msg.textContent = message;
    modal.hidden = false;
    modal.style.display = 'flex';
    document.getElementById('modal-close').focus();
  }
  function hideModal() {
    const modal = document.getElementById('modal');
    modal.hidden = true;
    modal.style.display = 'none';
  }
  document.getElementById('modal-close').addEventListener('click', hideModal);

  // Confirmation dialog for phase change
  const confirmationModal = document.getElementById('confirmationModal');
  const confirmationMessage = document.getElementById('confirmationMessage');
  const confirmOkBtn = document.getElementById('confirmOkBtn');
  const confirmCancelBtn = document.getElementById('confirmCancelBtn');

  let confirmCallback = null;

  function showConfirm(message, callback) {
    confirmationMessage.textContent = message;
    confirmationModal.hidden = false;
    confirmationModal.style.display = 'flex';
    confirmCallback = callback;
    confirmOkBtn.focus();
  }

  function hideConfirm() {
    confirmationModal.hidden = true;
    confirmationModal.style.display = 'none';
    confirmCallback = null;
  }

  confirmOkBtn.addEventListener('click', () => {
    if(confirmCallback) confirmCallback();
    hideConfirm();
  });
  confirmCancelBtn.addEventListener('click', hideConfirm);

  // Sidebar toggle
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleSidebar');
  toggleBtn.addEventListener('click', () => {
    const collapsed = sidebar.classList.toggle('collapsed');
    toggleBtn.setAttribute('aria-pressed', collapsed ? 'true' : 'false');
  });

  // Load contracts, optionally filtered by email search
  function loadContracts(searchEmail = '') {
    contractsDiv.innerHTML = '';
    let contracts = dataStore.contracts;
    if (searchEmail) {
      contracts = contracts.filter(c => c.userEmail.toLowerCase() === searchEmail.toLowerCase());
    }
    contracts.forEach(c => {
      const div = document.createElement('div');
      div.className = 'contract';
      div.innerHTML = `
        <p><strong>ID:</strong> ${c.id}</p>
        <p><strong>User Email:</strong> ${c.userEmail}</p>
        <p><strong>Account Size:</strong> $${c.accountSize}</p>
        <p><strong>Challenge Type:</strong> ${c.challengeType}</p>
        <p><strong>Status:</strong> ${c.contractStatus}</p>
        <select aria-label="Change KYC Status">
          <option value="Not Submitted" ${c.kycStatus==='Not Submitted'?'selected':''}>Not Submitted</option>
          <option value="Pending" ${c.kycStatus==='Pending'?'selected':''}>Pending</option>
          <option value="Approved" ${c.kycStatus==='Approved'?'selected':''}>Approved</option>
          <option value="Rejected" ${c.kycStatus==='Rejected'?'selected':''}>Rejected</option>
        </select>
        <button>Disable</button>
        <button>Move to Next Phase</button>
      `;
      // Select change for KYC
      div.querySelector('select').addEventListener('change', (e) => {
        c.kycStatus = e.target.value;
        localStorage.setItem('nexa_data', JSON.stringify(dataStore));
        showModal('KYC Status updated');
      });
      // Disable button
      div.querySelector('button:nth-of-type(1)').addEventListener('click', () => {
        c.contractStatus = 'Disabled';
        localStorage.setItem('nexa_data', JSON.stringify(dataStore));
        showModal('Contract disabled');
        loadContracts(searchEmail);
      });
      // Move to next phase button
      div.querySelector('button:nth-of-type(2)').addEventListener('click', () => {
        // Confirm and move phase
        showConfirm(`Are you sure you want to move contract ID ${c.id} to next phase?`, () => {
          moveToNextPhase(c);
          loadContracts(searchEmail);
        });
      });
      contractsDiv.appendChild(div);
    });
  }

  // Move to next phase logic based on contract challenge type and current phase
  function moveToNextPhase(contract) {
    if(contract.challengeType.includes('1-Step')) {
      if(contract.phaseStatus !== 'funded') {
        contract.phaseStatus = 'funded';
        contract.contractStatus = 'Funded';
        contract.fundedDateISO = new Date().toISOString();
      }
    } else if(contract.challengeType.includes('2-Step')) {
      if(contract.phaseStatus === 'unfunded') {
        contract.phaseStatus = 'phase1';
      } else if(contract.phaseStatus === 'phase1') {
        contract.phaseStatus = 'phase2';
      } else if(contract.phaseStatus === 'phase2') {
        contract.phaseStatus = 'funded';
        contract.contractStatus = 'Funded';
        contract.fundedDateISO = new Date().toISOString();
      }
    }
    localStorage.setItem('nexa_data', JSON.stringify(dataStore));
    showModal('Contract phase updated successfully');
  }

  // Add contract handler
  document.getElementById('addContractBtn').addEventListener('click', () => {
    const userEmail = document.getElementById('userEmail').value.trim();
    const accountSize = parseInt(document.getElementById('accountSize').value);
    const challengeType = document.getElementById('challengeType').value.trim();
    const contractStatus = document.getElementById('contractStatus').value.trim();
    const kycStatus = document.getElementById('kycStatus').value.trim();
    const contractExpiry = document.getElementById('contractExpiry').value.trim();
    const payoutDate = document.getElementById('payoutDate').value.trim();
    
    if(!userEmail || isNaN(accountSize) || !challengeType || !contractStatus || !kycStatus){
      showModal('Please fill all required fields correctly');
      return;
    }
    if(!dataStore.users.find(u=>u.email.toLowerCase()===userEmail.toLowerCase())){
      showModal('User not found');
      return;
    }
    const contract = {
      id: dataStore.contracts.length+1,
      userEmail,
      accountSize,
      challengeType,
      contractStatus,
      kycStatus,
      contractExpiry,
      payoutDate,
      phaseStatus: 'unfunded',
      fundedDateISO: null
    };
    dataStore.contracts.push(contract);
    localStorage.setItem('nexa_data', JSON.stringify(dataStore));
    showModal('Contract added successfully');
    // Clear inputs
    ['userEmail','accountSize','challengeType','contractStatus','kycStatus','contractExpiry','payoutDate'].forEach(id=>{
      document.getElementById(id).value='';
    });
    loadContracts();
  });

  // Search contracts by userEmail input
  document.getElementById('searchEmail').addEventListener('input', e => {
    loadContracts(e.target.value.trim());
  });

  // Send notification handler
  document.getElementById('sendNotifBtn').addEventListener('click', () => {
    const notifEmail = document.getElementById('notifEmail').value.trim();
    const notifMessage = document.getElementById('notifMessage').value.trim();
    if(!notifEmail || !notifMessage){
      showModal('Please enter user email and message');
      return;
    }
    if(!dataStore.users.find(u=>u.email.toLowerCase()===notifEmail.toLowerCase())){
      showModal('User not found');
      return;
    }
    const notification = {
      id: dataStore.notifications.length+1,
      userEmail: notifEmail,
      message: notifMessage,
      createdAt: new Date().toISOString()
    };
    dataStore.notifications.push(notification);
    localStorage.setItem('nexa_data', JSON.stringify(dataStore));
    showModal('Notification sent');
    document.getElementById('notifEmail').value = '';
    document.getElementById('notifMessage').value = '';
  });

  document.getElementById('logout').addEventListener('click', () => {
    localStorage.removeItem('authToken');
    window.location.href = 'login.html';
  });

  // Initialize
  window.addEventListener('load', () => {
    dataStore = initDataStore();
    loadContracts();
  });
})();
</script>
</body>
</html>
