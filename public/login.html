  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Nexa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Montserrat', sans-serif; background: linear-gradient(to bottom right, #fce7f3, #fff); }</style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-lg border border-pink-200 max-w-md w-full">
    <h1 class="text-3xl font-bold text-pink-600 text-center mb-6">Nexa Login</h1>
    <form id="loginForm" class="space-y-4">
      <div>
        <p>Please Login to Purchase an Account</p>
        <label for="email" class="block text-gray-700 font-medium">Email</label>
        <input type="email" id="email" class="w-full p-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500" required />
      </div>
      <div>
        <label for="password" class="block text-gray-700 font-medium">Password</label>
        <input type="password" id="password" class="w-full p-2 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500" required />
      </div>
      <div id="errorMessage" class="text-red-500 text-sm hidden"></div>
      <button type="submit" class="w-full bg-pink-500 text-white p-2 rounded-full hover:bg-pink-600 transition-colors font-semibold">Login</button>
    </form>
    <p class="text-center text-gray-600 mt-4">
      Don't have an account? <a href="signup.html" class="text-pink-500 hover:underline">Sign Up</a>
    </p>
  </div>
  <script>
    (() => {
      const JWT_SECRET = 'nexa_secure_2025';

      // JWT-lite implementation
      function base64url(str) {
        return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      async function hmacSha256(data, secret) {
        const encoder = new TextEncoder();
        const key = await crypto.subtle.importKey(
          'raw',
          encoder.encode(secret),
          { name: 'HMAC', hash: 'SHA-256' },
          false,
          ['sign']
        );
        const signature = await crypto.subtle.sign('HMAC', key, encoder.encode(data));
        return base64url(String.fromCharCode(...new Uint8Array(signature)));
      }
      async function encodeJwt(payload, secret) {
        const header = { alg: 'HS256', typ: 'JWT' };
        const encodedHeader = base64url(JSON.stringify(header));
        const encodedPayload = base64url(JSON.stringify(payload));
        const signature = await hmacSha256(`${encodedHeader}.${encodedPayload}`, secret);
        return `${encodedHeader}.${encodedPayload}.${signature}`;
      }
      async function decodeJwt(token, secret) {
        try {
          const [encodedHeader, encodedPayload, signature] = token.split('.');
          const expectedSignature = await hmacSha256(`${encodedHeader}.${encodedPayload}`, secret);
          if (signature !== expectedSignature) throw new Error('Invalid signature');
          return JSON.parse(atob(encodedPayload.replace(/-/g, '+').replace(/_/g, '/')));
        } catch (err) {
          console.error('JWT decode error:', err.message);
          return null;
        }
      }

      function simpleHash(text) {
        let hash = 0;
        for (let i = 0; i < text.length; i++) {
          hash = ((hash << 5) - hash) + text.charCodeAt(i);
          hash |= 0;
        }
        return hash.toString();
      }

      function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = message;
        errorDiv.classList.remove('hidden');
      }

      function hideError() {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.classList.add('hidden');
        errorDiv.textContent = '';
      }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('Please enter a valid email address.');
          return;
        }
        if (!password || password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }

        let dataStore = JSON.parse(localStorage.getItem('nexa_data')) || { users: [], contracts: [], notifications: [] };
        let user = dataStore.users.find(u => u.email === email);

        if (!user) {
          showError('User not found. Please sign up.');
          return;
        }
        if (user.password !== simpleHash(password)) {
          showError('Incorrect password.');
          return;
        }

        try {
          const token = await encodeJwt({ email: user.email, name: user.name, iat: Math.floor(Date.now() / 1000) }, JWT_SECRET);
          console.log('Generated authToken:', token);
          localStorage.setItem('authToken', token);
          console.log('authToken stored in localStorage');
          window.location.href = 'dashboard.html';
        } catch (err) {
          console.error('JWT encoding error:', err.message);
          showError('Authentication error: Failed to generate token.');
        }
      });
    })();
  </script>
</body>
</html>
