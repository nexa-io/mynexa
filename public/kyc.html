<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Times New Roman', Times, serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-blue-600">Nexa</h1>
            <a href="dashboard.html" class="text-gray-600 hover:text-blue-600">Back to Dashboard</a>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div id="kyc-content">
            <h2 class="text-2xl font-bold text-gray-800">KYC Verification</h2>
            <p id="kyc-message" class="mt-4 text-gray-600"></p>
            <p id="kyc-status" class="mt-2 font-semibold"></p>
            <a id="kyc-link" href="https://forms.gle/esMxwUYE3fMVG1qn6" target="_blank" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 hidden">Submit KYC</a>
        </div>
    </main>
    <footer class="bg-gray-800 text-white py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between">
            <p>&copy; 2025 Nexa. All rights reserved.</p>
            <div class="flex space-x-4">
                <a href="terms.html" class="hover:text-blue-300">Terms</a>
                <a href="privacy.html" class="hover:text-blue-300">Privacy</a>
                <a href="contact.html" class="hover:text-blue-300">Contact</a>
            </div>
        </div>
    </footer>
    <script>
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!localStorage.getItem('loggedIn')) {
            window.location.href = 'login.html';
        }
        const kycMessage = document.getElementById('kyc-message');
        const kycStatus = document.getElementById('kyc-status');
        const kycLink = document.getElementById('kyc-link');
        if (user.contractStatus !== 'Funded') {
            kycMessage.textContent = 'Get funded to access KYC! Pass your challenge to unlock a funded account.';
        } else {
            kycStatus.textContent = `KYC Status: ${user.kycStatus}`;
            if (user.kycStatus === 'Not Submitted' || user.kycStatus === 'Rejected') {
                kycMessage.textContent = 'Upload your NIN slip and selfie. Fraud will result in EFCC referral.';
                kycLink.classList.remove('hidden');
            } else if (user.kycStatus === 'Pending') {
                kycMessage.textContent = 'KYC under review. Check back in 48-72 hours.';
            } else {
                kycMessage.textContent = 'KYC approved! You can request payouts.';
            }
        }
    </script>
</body>
</html>
