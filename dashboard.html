<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - Nexa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to bottom right, #fce7f3, #fff);
            margin: 0;
            min-height: 100vh;
        }
        .flex {
            display: flex;
        }
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            width: 16rem;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 1.5rem;
        }
        .sidebar svg rect {
            rx: 2;
        }
        .sidebar h1 {
            color: #db2777;
            font-weight: 700;
            font-size: 1.25rem;
            margin-left: 0.5rem;
        }
        .nav-links {
            margin-top: 2rem;
        }
        .nav-links a,
        .nav-links button {
            display: block;
            margin-bottom: 1rem;
            color: #4b5563;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            padding: 0;
        }
        .nav-links a:hover,
        .nav-links button:hover {
            color: #db2777;
        }
        main {
            margin-left: 16rem;
            padding: 1.5rem;
            flex: 1;
        }
        .card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        h2, h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #1f2937;
        }
        .contract, .notification {
            border: 1px solid #f9a8d4;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
            color: #374151;
        }
        /* Modal styles */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #modal .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            max-width: 400px;
            width: 90%;
            border: 1px solid #f9a8d4;
            text-align: center;
        }
        #modal-close {
            background: #db2777;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
        }
        #modal-close:hover {
            background: #be185d;
        }
    </style>
</head>
<body>
    <div class="flex">
        <aside class="sidebar">
            <div class="logo flex items-center space-x-2">
                <svg width="24" height="24" viewBox="0 0 50 50" fill="none">
                    <rect x="10" y="10" width="10" height="10" fill="#ec4899" rx="2"></rect>
                    <rect x="30" y="10" width="10" height="10" fill="#f9a8d4" rx="2"></rect>
                    <rect x="10" y="30" width="10" height="10" fill="#f9a8d4" rx="2"></rect>
                    <rect x="30" y="30" width="10" height="10" fill="#ec4899" rx="2"></rect>
                </svg>
                <h1>NEXA</h1>
            </div>
            <nav class="nav-links">
                <a href="#" aria-current="page">Dashboard</a>
                <a href="pricing.html">Pricing</a>
                <a href="https://docuseal.co" target="_blank" rel="noopener">Submit KYC</a>
                <button id="logout">Logout</button>
            </nav>
        </aside>
        <main>
            <h2>Dashboard</h2>

            <section class="card">
                <h3>Your Contracts</h3>
                <div id="contracts"></div>
            </section>

            <section class="card">
                <h3>Notifications</h3>
                <div id="notifications"></div>
            </section>
        </main>
    </div>

    <div id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-message">
        <div class="modal-content">
            <p id="modal-message"></p>
            <button id="modal-close">OK</button>
        </div>
    </div>

    <script>
        // Simple JWT encode/decode simulation (no signature)
        function encodeJWT(payload) {
            return btoa(JSON.stringify(payload));
        }
        function decodeJWT(token) {
            try {
                return JSON.parse(atob(token));
            } catch {
                return null;
            }
        }

        // Basic password hashing substitute (not secure, for demo only)
        function simpleHash(text) {
            let hash = 0;
            for(let i=0; i < text.length; i++) {
                hash = ((hash << 5) - hash) + text.charCodeAt(i);
                hash |= 0; // Convert to 32bit integer
            }
            return hash.toString();
        }

        function initDataStore() {
            let dataStore = JSON.parse(localStorage.getItem('nexa_data')) || {
                users: [],
                contracts: [],
                notifications: []
            };
            if (!dataStore.users.find(u => u.email === 'infocontactnexa@gmail.com')) {
                dataStore.users.push({
                    email: 'infocontactnexa@gmail.com',
                    password: simpleHash('Strika001$'),
                    name: 'Admin',
                    phone: '',
                    address: '',
                    isAdmin: true
                });
                localStorage.setItem('nexa_data', JSON.stringify(dataStore));
            }
            return dataStore;
        }

        function showModal(message) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-message').innerText = message;
            modal.style.display = 'flex';
        }
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });

        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        });

        function loadDashboard() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                showModal('Please login');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                return;
            }

            const decoded = decodeJWT(token);
            if (!decoded || !decoded.email) {
                showModal('Invalid token');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                return;
            }

            const dataStore = initDataStore();

            // Show contracts for logged in user
            const contractsDiv = document.getElementById('contracts');
            contractsDiv.innerHTML = '';
            dataStore.contracts.filter(c => c.userEmail === decoded.email).forEach(contract => {
                const div = document.createElement('div');
                div.className = 'contract';
                div.innerHTML = `
                    <p><strong>ID:</strong> ${contract.id}</p>
                    <p><strong>Account Size:</strong> $${contract.accountSize}</p>
                    <p><strong>Challenge Type:</strong> ${contract.challengeType}</p>
                    <p><strong>Status:</strong> ${contract.contractStatus}</p>
                    <p><strong>KYC Status:</strong> ${contract.kycStatus}</p>
                    <p><strong>Expiry:</strong> ${contract.contractExpiry}</p>
                    <p><strong>Payout Date:</strong> ${contract.payoutDate}</p>
                `;
                contractsDiv.appendChild(div);
            });

            // Show notifications for logged in user
            const notificationsDiv = document.getElementById('notifications');
            notificationsDiv.innerHTML = '';
            dataStore.notifications.filter(n => n.userEmail === decoded.email).forEach(notif => {
                const div = document.createElement('div');
                div.className = 'notification';
                div.innerHTML = `<p>${notif.message} <br><small>${new Date(notif.createdAt).toLocaleString()}</small></p>`;
                notificationsDiv.appendChild(div);
            });
        }

        loadDashboard();
    </script>
</body>
</html>
