<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jwt-simple/0.5.6/jwt-simple.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; display: flex; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; border: 1px solid #f9a8d4; text-align: center; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 to-white min-h-screen">
    <div class="flex">
        <div class="fixed top-0 left-0 h-full w-64 bg-white shadow-md p-6">
            <div class="flex items-center space-x-2 mb-8">
                <svg class="w-6 h-6" viewBox="0 0 50 50" fill="none">
                    <rect x="10" y="10" width="10" height="10" fill="#ec4899" rx="2"/>
                    <rect x="30" y="10" width="10" height="10" fill="#f9a8d4" rx="2"/>
                    <rect x="10" y="30" width="10" height="10" fill="#f9a8d4" rx="2"/>
                    <rect x="30" y="30" width="10" height="10" fill="#ec4899" rx="2"/>
                </svg>
                <h1 class="text-xl font-bold text-pink-600">NEXA</h1>
            </div>
            <nav class="space-y-4">
                <a href="#" class="block text-gray-600 hover:text-pink-600 font-medium">Dashboard</a>
                <a href="pricing.html" class="block text-gray-600 hover:text-pink-600 font-medium">Pricing</a>
                <a href="https://docuseal.co" class="block text-gray-600 hover:text-pink-600 font-medium">Submit KYC</a>
                <button id="logout" class="block text-gray-600 hover:text-pink-600 font-medium">Logout</button>
            </nav>
        </div>
        <div class="flex-1 p-6 ml-64">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Dashboard</h2>
            <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Your Contracts</h3>
                <div id="contracts" class="space-y-4"></div>
            </div>
            <div class="bg-white rounded-2xl shadow-md p-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Notifications</h3>
                <div id="notifications" class="space-y-4"></div>
            </div>
        </div>
    </div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <p id="modal-message" class="text-gray-800 mb-4"></p>
            <button id="modal-close" class="bg-pink-500 text-white px-4 py-1 rounded-full hover:bg-pink-600">OK</button>
        </div>
    </div>
    <script>
        const JWT_SECRET = 'nexa_secure_2025';
        function initDataStore() {
            let dataStore = JSON.parse(localStorage.getItem('nexa_data')) || {
                users: [],
                contracts: [],
                notifications: []
            };
            if (!dataStore.users.find(u => u.email === 'infocontactnexa@gmail.com')) {
                dataStore.users.push({
                    email: 'infocontactnexa@gmail.com',
                    password: bcrypt.hashSync('NexaAdmin2025', 10),
                    name: 'Admin',
                    phone: '',
                    address: '',
                    isAdmin: true
                });
                localStorage.setItem('nexa_data', JSON.stringify(dataStore));
            }
            return dataStore;
        }
        function showModal(message) {
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal').style.display = 'flex';
        }
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });
        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        });
        function loadDashboard() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                showModal('Please login');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                return;
            }
            let decoded;
            try {
                decoded = jwt.decode(token, JWT_SECRET);
            } catch (err) {
                showModal('Invalid token');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                return;
            }
            const dataStore = initDataStore();
            const contractsDiv = document.getElementById('contracts');
            dataStore.contracts.filter(c => c.userEmail === decoded.email).forEach(contract => {
                const div = document.createElement('div');
                div.className = 'border border-pink-200 rounded-lg p-4';
                div.innerHTML = `
                    <p><strong>ID:</strong> ${contract.id}</p>
                    <p><strong>Account Size:</strong> $${contract.accountSize}</p>
                    <p><strong>Challenge Type:</strong> ${contract.challengeType}</p>
                    <p><strong>Status:</strong> ${contract.contractStatus}</p>
                    <p><strong>KYC Status:</strong> ${contract.kycStatus}</p>
                    <p><strong>Expiry:</strong> ${contract.contractExpiry}</p>
                    <p><strong>Payout Date:</strong> ${contract.payoutDate}</p>
                `;
                contractsDiv.appendChild(div);
            });
            const notificationsDiv = document.getElementById('notifications');
            dataStore.notifications.filter(n => n.userEmail === decoded.email).forEach(notif => {
                const div = document.createElement('div');
                div.className = 'border border-pink-200 rounded-lg p-4';
                div.innerHTML = `<p>${notif.message} <br><small>${notif.createdAt}</small></p>`;
                notificationsDiv.appendChild(div);
            });
        }
        loadDashboard();
    </script>
</body>
</html>
