<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard - Nexa</title>
<style>
  /* (same CSS from previous dashboard.html version, omitted here for brevity; use the same styles as before) */
  /* Include styles from previous provided dashboard.html exactly */
</style>
</head>
<body>

<!-- Sidebar and toggle button, same as before -->

<aside id="sidebar" aria-label="Sidebar Navigation">
  <!-- Sidebar content as before -->
</aside>
<button id="toggleSidebar" aria-label="Toggle sidebar menu" aria-pressed="false" title="Toggle Menu">
  <!-- Toggle icon svg -->
</button>

<main>
  <div id="welcomeBanner" role="region" aria-label="Welcome banner">
    <img src="https://ui-avatars.com/api/?name=User&background=DB2777&color=fff&rounded=true" alt="User Profile Picture" />
    <span id="welcomeText">Welcome, User</span>
    <button id="profileBtn" style="margin-left:auto; padding:0.3rem 0.8rem; font-weight:600; border:none;background-color:var(--pink);color:#fff;border-radius:9999px;cursor:pointer;">Profile</button>
  </div>

  <section id="summary" aria-label="Dashboard summary statistics">
    <!-- Summary cards as before -->
  </section>

  <section class="card" aria-labelledby="contractsHeading">
    <h3 id="contractsHeading">Your Contracts (Click to View Details)</h3>
    <div id="contracts" role="list" aria-live="polite"></div>
  </section>

  <section class="card" aria-labelledby="notificationsHeading">
    <h3 id="notificationsHeading">Notifications</h3>
    <div id="notifications" role="list" aria-live="polite">Loading notifications...</div>
  </section>

  <section id="recentActivity" class="card" aria-labelledby="recentActivityHeading">
    <h3 id="recentActivityHeading">Recent Activity</h3>
    <ul id="activityList" role="list" aria-live="polite" tabindex="0">
      <li>No recent activities</li>
    </ul>
  </section>
</main>

<!-- Contract Detail Modal without countdown -->

<div id="contractModal" role="dialog" aria-modal="true" aria-labelledby="contractModalTitle" hidden>
  <div class="modal-content" tabindex="0">
    <h2 id="contractModalTitle">Contract Details</h2>
    <div id="contractDetails"></div>

    <div id="contract-buttons">
      <button id="signContractBtn" disabled>Sign Contract</button>
      <button id="verifySigningBtn" disabled>Verify Signing</button>
      <button id="submitKycBtn" disabled>Submit KYC</button>
      <button id="moveNextPhaseBtn" disabled>Move to Next Phase</button>
      <button id="requestPayoutBtn" disabled>Request Payout</button>
    </div>

    <button id="contractModal-close" style="margin-top:1.5rem;">Close</button>
  </div>
</div>

<!-- Generic Modal -->
<div id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-message" aria-describedby="modal-desc" hidden>
  <div class="modal-content">
    <p id="modal-message" role="heading" aria-level="3"></p>
    <button id="modal-close" aria-label="Close modal">OK</button>
  </div>
</div>

<script>
(() => {
  let dataStore;
  let currentUser;
  let activeContract = null;

  const PAYSTACK_TIER_MAP = {
    "https://paystack.shop/pay/Tier1-1-Step": {tier: 1, accountSize: 100, step: 1},
    "https://paystack.shop/pay/Tier1-2-Step": {tier: 1, accountSize: 100, step: 2},
    "https://paystack.shop/pay/Tier2-1-Step": {tier: 2, accountSize: 250, step: 1},
    "https://paystack.shop/pay/Tier2-2-Step": {tier: 2, accountSize: 250, step: 2},
    "https://paystack.shop/pay/Tier3-1-Step": {tier: 3, accountSize: 500, step: 1},
    "https://paystack.shop/pay/Tier3-2-Step": {tier: 3, accountSize: 500, step: 2},
    "https://paystack.shop/pay/Tier4-1-Step": {tier: 4, accountSize: 1000, step: 1},
    "https://paystack.shop/pay/Tier4-2-Step": {tier: 4, accountSize: 1000, step: 2}
  };
  const PHASE_STATUS = { 'unfunded': 'Unfunded', 'funded': 'Funded', 'phase1': 'Phase1', 'phase2': 'Phase2', 'disabled': 'Disabled' };

  function decodeJWT(token) {
    try { return JSON.parse(atob(token)); } catch { return null; }
  }
  function simpleHash(text) {
    let hash = 0;
    for(let i=0; i < text.length; i++) {
      hash = ((hash << 5) - hash) + text.charCodeAt(i);
      hash |= 0;
    }
    return hash.toString();
  }
  function saveDataStore() {
    localStorage.setItem('nexa_data', JSON.stringify(dataStore));
  }
  function showModal(message) {
    const modal = document.getElementById('modal');
    const messageElem = document.getElementById('modal-message');
    messageElem.textContent = message;
    modal.hidden = false;
    modal.style.display = 'flex';
    modal.querySelector('button').focus();
  }
  function hideModal() {
    const modal = document.getElementById('modal');
    modal.hidden = true;
    modal.style.display = 'none';
  }
  function initSidebarToggle() {
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleSidebar');
    toggleBtn.addEventListener('click', () => {
      const collapsed = sidebar.classList.toggle('collapsed');
      toggleBtn.setAttribute('aria-pressed', collapsed ? 'true' : 'false');
    });
  }
  function loadUserData() {
    const token = localStorage.getItem('authToken');
    if(!token) {showModal('Please login'); setTimeout(() => { window.location.href = 'login.html'; }, 2000); return false;}
    const userInfo = decodeJWT(token);
    if(!userInfo || !userInfo.email) {showModal('Invalid or expired token'); setTimeout(() => { window.location.href = 'login.html'; }, 2000); return false;}
    dataStore = JSON.parse(localStorage.getItem('nexa_data')) || { users: [], contracts: [], notifications: [] };
    currentUser = dataStore.users.find(u => u.email === userInfo.email);
    if(!currentUser) {showModal('User no longer exists'); setTimeout(() => { window.location.href = 'login.html'; }, 2000); return false;}
    // Admin check
    if(!currentUser.isAdmin) {
      showModal('Admin access required');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      return false;
    }
    if(!dataStore.users.find(u=>u.email==='infocontactnexa@gmail.com')) {
      dataStore.users.push({
        email: 'infocontactnexa@gmail.com',
        password: simpleHash('Strika001$'),
        name: 'Admin',
        phone: '',
        address: '',
        isAdmin: true
      });
      saveDataStore();
    }
    return true;
  }
  function checkRedirectForPayment() {
    // Not applicable to admin page
  }
  function captureRedirectURL() { }
  function loadContracts(searchEmail='') {
    const contractsDiv = document.getElementById('contracts');
    contractsDiv.innerHTML = '';
    let contracts = dataStore.contracts;
    if(searchEmail) contracts = contracts.filter(c => c.userEmail.toLowerCase()===searchEmail.toLowerCase());
    contracts.forEach(c=>{
      const div=document.createElement('div');
      div.className='contract';
      div.innerHTML=`
        <p><strong>ID:</strong> ${c.id}</p>
        <p><strong>User Email:</strong> ${c.userEmail}</p>
        <p><strong>Account Size:</strong> $${c.accountSize}</p>
        <p><strong>Challenge Type:</strong> ${c.challengeType}</p>
        <p><strong>Status:</strong> ${c.contractStatus}</p>
        <select aria-label="Change KYC Status">
          <option value="Not Submitted" ${c.kycStatus === 'Not Submitted'?'selected':''}>Not Submitted</option>
          <option value="Pending" ${c.kycStatus === 'Pending'?'selected':''}>Pending</option>
          <option value="Approved" ${c.kycStatus === 'Approved'?'selected':''}>Approved</option>
          <option value="Rejected" ${c.kycStatus === 'Rejected'?'selected':''}>Rejected</option>
        </select>
        <button>Disable</button>
        <button>Move to Next Phase</button>
      `;
      div.querySelector('select').addEventListener('change',e=>{
        c.kycStatus=e.target.value;
        saveDataStore();
        showModal('KYC Status updated');
      });
      div.querySelector('button:nth-of-type(1)').addEventListener('click',()=>{
        c.contractStatus = 'Disabled';
        saveDataStore();
        showModal('Contract disabled');
        loadContracts(searchEmail);
      });
      div.querySelector('button:nth-of-type(2)').addEventListener('click',()=>{
        showConfirm(`Are you sure you want to move contract ID ${c.id} to next phase?`, () => {
          moveToNextPhase(c);
          loadContracts(searchEmail);
        });
      });
      contractsDiv.appendChild(div);
    });
  }
  function moveToNextPhase(contract) {
    if(contract.challengeType.includes('1-Step')) {
      if(contract.phaseStatus !== 'funded') {
        contract.phaseStatus = 'funded';
        contract.contractStatus = 'Funded';
        contract.fundedDateISO = new Date().toISOString();
      }
    } else if(contract.challengeType.includes('2-Step')) {
      if(contract.phaseStatus === 'unfunded') contract.phaseStatus='phase1';
      else if(contract.phaseStatus === 'phase1') contract.phaseStatus='phase2';
      else if(contract.phaseStatus === 'phase2'){
        contract.phaseStatus='funded';
        contract.contractStatus='Funded';
        contract.fundedDateISO=new Date().toISOString();
      }
    }
    saveDataStore();
    showModal('Contract phase updated successfully');
  }
  document.getElementById('addContractBtn').addEventListener('click', () => {
    const userEmail = document.getElementById('userEmail').value.trim();
    const accountSize = parseInt(document.getElementById('accountSize').value);
    const challengeType = document.getElementById('challengeType').value.trim();
    const contractStatus = document.getElementById('contractStatus').value.trim();
    const kycStatus = document.getElementById('kycStatus').value.trim();
    const contractExpiry = document.getElementById('contractExpiry').value.trim();
    const payoutDate = document.getElementById('payoutDate').value.trim();
    if(!userEmail || isNaN(accountSize) || !challengeType || !contractStatus || !kycStatus){
      showModal('Please fill all required fields correctly');
      return;
    }
    if(!dataStore.users.find(u=>u.email.toLowerCase() === userEmail.toLowerCase())){
      showModal('User not found');
      return;
    }
    const contract = {
      id: dataStore.contracts.length+1,
      userEmail,
      accountSize,
      challengeType,
      contractStatus,
      kycStatus,
      contractExpiry,
      payoutDate,
      phaseStatus:'unfunded',
      fundedDateISO:null
    };
    dataStore.contracts.push(contract);
    saveDataStore();
    showModal('Contract added successfully');
    ['userEmail','accountSize','challengeType','contractStatus','kycStatus','contractExpiry','payoutDate'].forEach(id=>document.getElementById(id).value='');
    loadContracts();
  });
  document.getElementById('searchEmail').addEventListener('input', e=>loadContracts(e.target.value.trim()));
  document.getElementById('sendNotifBtn').addEventListener('click', () => {
    const notifEmail = document.getElementById('notifEmail').value.trim();
    const notifMessage = document.getElementById('notifMessage').value.trim();
    if(!notifEmail || !notifMessage){
      showModal('Please enter user email and message');
      return;
    }
    if(!dataStore.users.find(u=>u.email.toLowerCase() === notifEmail.toLowerCase())){
      showModal('User not found');
      return;
    }
    const notification = {
      id: dataStore.notifications.length+1,
      userEmail: notifEmail,
      message: notifMessage,
      createdAt: new Date().toISOString()
    };
    dataStore.notifications.push(notification);
    saveDataStore();
    showModal('Notification sent');
    document.getElementById('notifEmail').value='';
    document.getElementById('notifMessage').value='';
  });
  document.getElementById('logout').addEventListener('click', () => {
    localStorage.removeItem('authToken');
    window.location.href = 'login.html';
  });

  // Confirmation dialog handlers omitted for brevity (same as previous code)

  window.addEventListener('load', () => {
    if(!loadUserData()) return;
    loadContracts();
  });

  function loadUserData() {
    const token = localStorage.getItem('authToken');
    if(!token){
      showModal('Please login');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      return false;
    }
    const userInfo = decodeJWT(token);
    if(!userInfo || !userInfo.email){
      showModal('Invalid or expired token');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      return false;
    }
    dataStore = JSON.parse(localStorage.getItem('nexa_data')) || {users: [], contracts: [], notifications: []};
    const currentUser = dataStore.users.find(u => u.email === userInfo.email);
    if(!currentUser || !currentUser.isAdmin){
      showModal('Admin access required');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      return false;
    }
    return true;
  }
})();
</script>
</body>
</html>
