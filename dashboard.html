<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard - Nexa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
  :root {
    --pink: #db2777;
    --pink-light: #f9a8d4;
    --gray-dark: #1f2937;
    --gray-medium: #4b5563;
    --gray-light: #f3f4f6;
    --bg-gradient: linear-gradient(to bottom right, #fce7f3, #fff);
  }
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Montserrat', sans-serif;
    margin: 0;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
    color: var(--gray-dark);
    transition: padding-left 0.3s ease;
  }
  #sidebar {
    position: fixed; top: 0; left: 0;
    height: 100vh;
    width: 240px;
    background: white;
    box-shadow: 2px 0 8px rgb(219 39 119 / 0.15);
    padding: 1.5rem 1rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    transition: width 0.3s ease, opacity 0.3s ease;
    opacity: 1;
    pointer-events: auto;
    z-index: 1000;
  }
  /* Sidebar fully hidden on collapse */
  #sidebar.collapsed {
    width: 0;
    opacity: 0;
    pointer-events: none;
  }
  #sidebar .logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: default;
  }
  /* Hide content on collapse */
  #sidebar.collapsed .logo h1,
  #sidebar.collapsed nav a span {
    display: none;
  }
  #sidebar svg rect {
    rx: 2;
  }
  #sidebar h1 {
    color: var(--pink);
    font-weight: 700;
    font-size: 1.7rem;
    user-select: none;
  }
  nav {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  nav a,
  nav button {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0.5rem;
    font-weight: 600;
    color: var(--gray-medium);
    border: none;
    background: none;
    font-family: inherit;
    cursor: pointer;
    border-radius: 0.5rem;
    text-decoration: none;
    white-space: nowrap;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  nav a:hover,
  nav button:hover {
    background-color: var(--pink-light);
    color: var(--pink);
  }
  #sidebar.collapsed nav a,
  #sidebar.collapsed nav button {
    justify-content: center;
    padding: 0.5rem 0;
  }
  .nav-icon {
    width: 24px;
    height: 24px;
    fill: var(--gray-medium);
    flex-shrink: 0;
    transition: fill 0.2s;
  }
  nav a:hover .nav-icon,
  nav button:hover .nav-icon {
    fill: var(--pink);
  }
  #toggleSidebar {
    position: fixed;
    top: 18px;
    left: 82px; /* Positioned near left when sidebar collapsed */
    background: var(--pink);
    border: none;
    color: white;
    width: 38px;
    height: 38px;
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgb(219 39 119 / 0.3);
    transition: left 0.3s ease;
    z-index: 1100;
  }
  /* When sidebar expanded, toggle moves right */
  #sidebar:not(.collapsed) + #toggleSidebar {
    left: 250px;
  }
  #toggleSidebar svg {
    transition: transform 0.3s ease;
  }
  #toggleSidebar[aria-pressed="true"] svg {
    transform: rotate(180deg);
  }
  main {
    margin-left: 240px;
    padding: 2.5rem 2rem 3rem;
    transition: margin-left 0.3s ease;
    flex-grow: 1;
    min-height: 100vh;
    max-width: calc(100vw - 240px);
    box-sizing: border-box;
  }
  /* Adjust main margin when sidebar collapsed */
  #sidebar.collapsed ~ main {
    margin-left: 0;
    max-width: 100vw;
  }
  /* ... rest CSS remains unchanged ... */
  /* copy other styles from your original file here */
</style>
</head>
<body>

<aside id="sidebar" aria-label="Sidebar Navigation">
  <div class="logo" aria-label="Nexa Logo">
    <svg width="32" height="32" viewBox="0 0 50 50" fill="none" aria-hidden="true" focusable="false">
      <rect x="10" y="10" width="10" height="10" fill="#ec4899" rx="2"></rect>
      <rect x="30" y="10" width="10" height="10" fill="#f9a8d4" rx="2"></rect>
      <rect x="10" y="30" width="10" height="10" fill="#f9a8d4" rx="2"></rect>
      <rect x="30" y="30" width="10" height="10" fill="#ec4899" rx="2"></rect>
    </svg>
    <h1>NEXA</h1>
  </div>
  <nav>
    <a href="#" aria-current="page" tabindex="0">
      <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8v-10h-8v10zm0-18v6h8V3h-8z" />
      </svg>
      <span>Dashboard</span>
    </a>
    <a href="pricing.html">
      <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4 8 5.79 8 8s1.79 4 4 4zm0 2c-2.66 0-8 1.34-8 4v2h16v-2c0-2.66-5.34-4-8-4z" />
      </svg>
      <span>Pricing</span>
    </a>
    <a href="https://docuseal.co" target="_blank" rel="noopener noreferrer">
      <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M3 6v12h18V6H3zm2 4h14v4H5v-4z" />
      </svg>
      <span>Submit KYC</span>
    </a>
    <a href="contact.html">
      <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M21 8V7l-3 2-2-2-6 6-4-4-1 1v7h18v-7z" />
      </svg>
      <span>Contact Support</span>
    </a>
    <a href="faq.html">
      <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm.87 17.38-.14-.13-2.56-2.7a1 1 0 0 1-.28-.77V11.7a1 1 0 0 1 1-1h1a1 1 0 0 1 0 2h-.5v1.64l1.5 1.58a.75.75 0 1 1-1.33 1zM12 7a1.5 1.5 0 1 1-1.5 1.5A1.5 1.5 0 0 1 12 7z" />
      </svg>
      <span>FAQ</span>
    </a>
    <button id="logout" aria-label="Logout">
      <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M14 7v2H7v6h7v2l5-5-5-5zM19 19h-2v-2h2V7h-2V5h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z" />
      </svg>
      <span>Logout</span>
    </button>
  </nav>
</aside>

<button id="toggleSidebar" aria-label="Toggle sidebar menu" aria-pressed="false" title="Toggle Menu">
  <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
    <path d="M3 6h18M3 12h18M3 18h18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</button>

<main>
  <div id="welcomeBanner" role="region" aria-label="Welcome banner">
    <img src="https://ui-avatars.com/api/?name=User&background=DB2777&color=fff&rounded=true" alt="User Profile Picture" />
    <span id="welcomeText">Welcome, User</span>
    <button id="profileBtn" style="margin-left:auto; padding:0.3rem 0.8rem; font-weight:600; border:none;background-color:var(--pink);color:#fff;border-radius:9999px;cursor:pointer;">Profile</button>
  </div>
  <!-- Other content like summary, contracts, notifications, recent activities go here -->
</main>

<!-- Modals and scripts as before -->

<script>
(() => {
  // Login check
  function checkLogin() {
    const token = localStorage.getItem('authToken');
    if (!token) {
      window.location.href = 'login.html';
      return false;
    }
    try {
      const user = JSON.parse(atob(token));
      if (!user.email) {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    } catch {
      window.location.href = 'login.html';
      return false;
    }
  }

  if (!checkLogin()) return;

  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleSidebar');
  toggleBtn.addEventListener('click', () => {
    const collapsed = sidebar.classList.toggle('collapsed');
    toggleBtn.setAttribute('aria-pressed', collapsed ? 'true' : 'false');
  });

  document.getElementById('logout').addEventListener('click', () => {
    localStorage.removeItem('authToken');
    window.location.href = 'login.html';
  });

  document.getElementById('profileBtn').addEventListener('click', () => {
    alert('Profile update modal placeholder'); // Add your profile modal here
  });

  // Other dashboard JS from your original code...
})();
</script>

</body>
</html>
