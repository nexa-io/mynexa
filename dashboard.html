<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexa Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Top Nav -->
  <nav class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-pink-600">Nexa Dashboard</h1>
    <button id="logoutBtn" class="bg-pink-500 text-white px-4 py-2 rounded-lg hover:bg-pink-600">Logout</button>
  </nav>

  <!-- Content -->
  <div class="max-w-3xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-md">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Account Overview</h2>

    <div id="userInfo" class="space-y-3">
      <p><strong>Name:</strong> <span id="name"></span></p>
      <p><strong>Email:</strong> <span id="email"></span></p>
      <p><strong>Phone:</strong> <span id="phone"></span></p>
      <p><strong>Address:</strong> <span id="address"></span></p>
      <p><strong>KYC Status:</strong> <span id="kycStatus"></span></p>
      <p><strong>Contract Status:</strong> <span id="contractStatus"></span></p>
      <p><strong>Account Size:</strong> ₦<span id="accountSize"></span></p>
      <p><strong>Contract Expiry:</strong> <span id="contractExpiry"></span></p>
      <p><strong>Payout Date:</strong> <span id="payoutDate"></span></p>
    </div>

    <div class="mt-8">
      <h3 class="text-lg font-semibold mb-2">Update Contact Info</h3>
      <form id="updateForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">Phone</label>
          <input type="text" id="updatePhone" class="w-full border p-2 rounded-lg" placeholder="Enter new phone">
        </div>
        <div>
          <label class="block text-sm font-medium">Address</label>
          <input type="text" id="updateAddress" class="w-full border p-2 rounded-lg" placeholder="Enter new address">
        </div>
        <button type="submit" class="bg-pink-500 text-white px-4 py-2 rounded-lg hover:bg-pink-600">Update</button>
      </form>
    </div>
  </div>

  <script>
    const backendUrl = 'http://localhost:3000';

    // Redirect if not logged in
    const token = localStorage.getItem('authToken');
    if (!token) {
      window.location.href = 'login.html';
    }

    // Load user data
    async function loadUser() {
      try {
        const res = await fetch(`${backendUrl}/user-data`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (!res.ok) {
          localStorage.removeItem('authToken');
          window.location.href = 'login.html';
          return;
        }

        const user = await res.json();
        document.getElementById('name').textContent = user.name;
        document.getElementById('email').textContent = user.email;
        document.getElementById('phone').textContent = user.phone || 'Not set';
        document.getElementById('address').textContent = user.address || 'Not set';
        document.getElementById('kycStatus').textContent = user.kycStatus;
        document.getElementById('contractStatus').textContent = user.contractStatus;
        document.getElementById('accountSize').textContent = user.accountSize;
        document.getElementById('contractExpiry').textContent = user.contractExpiry;
        document.getElementById('payoutDate').textContent = user.payoutDate;

        document.getElementById('updatePhone').value = user.phone || '';
        document.getElementById('updateAddress').value = user.address || '';
      } catch (err) {
        console.error('Error loading user:', err);
        alert('Error loading user data');
      }
    }

    // Update profile
    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('updatePhone').value.trim();
      const address = document.getElementById('updateAddress').value.trim();

      try {
        const res = await fetch(`${backendUrl}/update-profile`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ phone, address })
        });

        if (!res.ok) throw new Error('Failed to update');

        const data = await res.json();
        alert(data.message);
        loadUser();
      } catch (err) {
        console.error('Update error:', err);
        alert('Could not update profile.');
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('authToken');
      window.location.href = 'login.html';
    });

    loadUser();
  </script>

</body>
</html>
