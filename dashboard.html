<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Times New Roman', Times, serif; }
        .popup { display: none; position: fixed; top-0; left-0; right-0; bottom-0; background: rgba(0,0,0,0.5); z-index: 50; }
        .popup-content { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 100px auto; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-blue-600">Nexa Dashboard</h1>
            <div class="relative">
                <button id="profile-btn" class="text-gray-600 hover:text-blue-600">Profile</button>
                <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-64 bg-white shadow rounded p-4">
                    <p id="profile-name" class="font-semibold"></p>
                    <p id="profile-email"></p>
                    <form id="profile-form" class="mt-4 space-y-2">
                        <input type="text" id="address" placeholder="Address" class="w-full p-2 border rounded">
                        <input type="tel" id="phone" placeholder="Phone" class="w-full p-2 border rounded">
                        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Update</button>
                    </form>
                </div>
            </div>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h2 id="welcome" class="text-2xl font-bold text-gray-800"></h2>
        <div id="contract-details" class="mt-6 bg-white p-6 rounded shadow">
            <h3 class="text-xl font-semibold text-blue-600">Contract Details</h3>
            <p><strong>Status:</strong> <span id="contract-status"></span></p>
            <p><strong>Account Size:</strong> $<span id="account-size"></span></p>
            <p><strong>Expiry:</strong> <span id="contract-expiry"></span></p>
            <p><strong>Payout Date:</strong> <span id="payout-date"></span></p>
        </div>
        <div class="mt-6 flex space-x-4">
            <a href="payout.html" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Payout</a>
            <a href="kyc.html" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">KYC</a>
            <a href="faq.html" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">FAQ</a>
            <a href="pricing.html" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Add Challenge</a>
            <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Log Out</button>
        </div>
        <div id="contract-popup" class="popup">
            <div class="popup-content">
                <h3 class="text-xl font-bold">Action Required</h3>
                <p id="contract-message"></p>
                <a id="contract-link" href="https://docuseal.com/d/w4aYAR5LfBb41G" target="_blank" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Sign Contract</a>
                <button id="close-contract-popup" class="mt-2 text-gray-600">Close</button>
            </div>
        </div>
        <div id="kyc-popup" class="popup">
            <div class="popup-content">
                <h3 class="text-xl font-bold">Action Required</h3>
                <p>Please complete KYC verification.</p>
                <a href="https://forms.gle/esMxwUYE3fMVG1qn6" target="_blank" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Verify KYC</a>
                <button id="close-kyc-popup" class="mt-2 text-gray-600">Close</button>
            </div>
        </div>
    </main>
    <footer class="bg-gray-800 text-white py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between">
            <p>&copy; 2025 Nexa. All rights reserved.</p>
            <div class="flex space-x-4">
                <a href="terms.html" class="hover:text-blue-300">Terms</a>
                <a href="privacy.html" class="hover:text-blue-300">Privacy</a>
                <a href="contact.html" class="hover:text-blue-300">Contact</a>
            </div>
        </div>
    </footer>
    <script>
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!localStorage.getItem('loggedIn')) {
            window.location.href = 'login.html';
        }
        async function loadUser() {
            const response = await fetch('https://nexa-backend-3wxt.onrender.com/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email, password: user.password })
            });
            if (response.ok) {
                const updatedUser = await response.json();
                localStorage.setItem('user', JSON.stringify(updatedUser));
                document.getElementById('welcome').textContent = `Welcome, ${updatedUser.name || 'Trader'}`;
                document.getElementById('profile-name').textContent = updatedUser.name || 'N/A';
                document.getElementById('profile-email').textContent = updatedUser.email || 'N/A';
                document.getElementById('contract-status').textContent = updatedUser.contractStatus || 'Unsigned';
                document.getElementById('account-size').textContent = updatedUser.accountSize || 0;
                document.getElementById('contract-expiry').textContent = updatedUser.contractExpiry || 'N/A';
                document.getElementById('payout-date').textContent = updatedUser.payoutDate || 'N/A';
                if (updatedUser.accountSize > 0 && updatedUser.contractStatus === 'Unsigned') {
                    document.getElementById('contract-message').textContent = 'Please sign the Trading Agreement to proceed.';
                    document.getElementById('contract-link').href = 'https://docuseal.com/d/w4aYAR5LfBb41G';
                    document.getElementById('contract-popup').style.display = 'flex';
                } else if (updatedUser.accountSize > 0 && updatedUser.contractStatus === 'Signed') {
                    document.getElementById('contract-message').textContent = 'Contract signed. Verify here:';
                    document.getElementById('contract-link').href = 'https://forms.gle/pGFFfzpVzzGzGrck8';
                    document.getElementById('contract-popup').style.display = 'flex';
                } else if (updatedUser.contractStatus === 'Funded' && updatedUser.kycStatus === 'Not Submitted') {
                    document.getElementById('kyc-popup').style.display = 'flex';
                }
            }
        }
        loadUser();
        document.getElementById('close-contract-popup').addEventListener('click', () => {
            document.getElementById('contract-popup').style.display = 'none';
        });
        document.getElementById('close-kyc-popup').addEventListener('click', () => {
            document.getElementById('kyc-popup').style.display = 'none';
        });
        document.getElementById('profile-btn').addEventListener('click', () => {
            document.getElementById('profile-dropdown').classList.toggle('hidden');
        });
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('https://nexa-backend-3wxt.onrender.com/update-profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: user.email,
                    address: document.getElementById('address').value,
                    phone: document.getElementById('phone').value
                })
            });
            if (response.ok) {
                user.address = document.getElementById('address').value;
                user.phone = document.getElementById('phone').value;
                localStorage.setItem('user', JSON.stringify(user));
                alert('Profile updated!');
            }
        });
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });
        const urlParams = new URLSearchParams(window.location.search);
        const challenge = urlParams.get('challenge');
        const validChallenges = ['Tier1-1-Step', 'Tier2-1-Step', 'Tier3-1-Step', 'Tier4-1-Step', 'Tier1-2-Step', 'Tier2-2-Step', 'Tier3-2-Step', 'Tier4-2-Step'];
        if (challenge && validChallenges.includes(challenge)) {
            const accountSize = challenge.includes('Tier1') ? 100 : challenge.includes('Tier2') ? 200 : challenge.includes('Tier3') ? 500 : 1000;
            user.challenges = user.challenges || [];
            user.challenges.push(challenge);
            user.accountSize = accountSize;
            user.contractStatus = 'Unsigned';
            user.contractExpiry = new Date(Date.now() + (challenge.includes('1-Step') ? 30 : 60) * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            fetch('https://nexa-backend-3wxt.onrender.com/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            }).then(() => loadUser());
        }
    </script>
</body>
</html>
