<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Support - Nexa</title>
<style>
  body {font-family: 'Montserrat', sans-serif; background: #f9f9f9; margin:0; padding:2rem;}
  h1 {color: #db2777; text-align: center; margin-bottom: 2rem;}
  form {max-width: 600px; margin: auto; background: white; padding:2rem; border-radius: 1rem; box-shadow: 0 8px 20px rgba(219,39,119,0.15);}
  label {display: block; margin-bottom: 0.5rem; font-weight: 600;}
  input, textarea {width: 100%; padding:0.6rem; margin-bottom: 1rem; border-radius: 0.5rem; border: 1px solid #f9a8d4; font-size:1rem;}
  textarea {resize: vertical; min-height: 100px;}
  button {background: #db2777; color: white; padding: 0.7rem 1.5rem; border: none; border-radius: 9999px; font-weight: 700; font-size: 1rem; cursor: pointer;}
  button:hover {background: #be185d;}
</style>
</head>
<body>
  <h1>Contact Support</h1>
  <form id="contactForm">
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Your Name" required />
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" required />
    <label for="message">Message</label>
    <textarea id="message" placeholder="Your message..." required></textarea>
    <button type="submit">Send Message</button>
  </form>
  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e){
      e.preventDefault();
      alert('Thanks for reaching out! We will get back to you soon.');
      this.reset();
    });
  </script>
</body>
</html>
