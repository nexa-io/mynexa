<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact & FAQ - Nexa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
  body { font-family: 'Montserrat', sans-serif; margin: 0; background: #fee2e9; color: #831843; }
  header { padding: 1rem 2rem; background: white; border-bottom: 2px solid #db2777; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-weight: 900; margin: 0; }
  main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  section { margin-bottom: 3rem; }
  section h2 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
  section p { font-size: 1.125rem; line-height: 1.5; margin-bottom: 1.5rem; }
  .faq-item { margin-bottom: 1.5rem; }
  .faq-item h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
  .faq-item p { font-size: 1rem; margin-bottom: 0; }
  .contact { background: #db2777; color: white; padding: 2rem; border-radius: 1rem; text-align: center; }
  .contact h3 { font-weight: 800; font-size: 1.5rem; margin-bottom: 1rem; }
  .contact p { font-weight: 600; font-size: 1.125rem; }
  footer { text-align: center; padding: 1rem 0; font-weight: 600; color: #c026d3; }
</style>
</head>
<body>
<header>
  <h1>Nexa - Contact & FAQ</h1>
</header>
<main>
  <section class="contact">
    <h3>Contact Us</h3>
    <p>Have more questions? Reach out to us at infocontactnexa@gmail.com for assistance.</p>
  </section>
</main>
<footer>
  &copy; <span id="year">2025</span> Nexa. All rights reserved.
</footer>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
