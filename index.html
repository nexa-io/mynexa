<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexa - We've Moved!</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Ubuntu, "Helvetica Neue", sans-serif;
      background: linear-gradient(to bottom right, #fce7f3, #fff);
      color: #4b5563;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .container {
      max-width: 700px;
      background: #fff;
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 6px 24px rgba(236, 72, 153, 0.15);
    }
    h1 {
      color: #ec4899;
      font-weight: 800;
      font-size: 2.75rem;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
      text-shadow: 0 1px 3px rgba(236, 72, 153, 0.4);
    }
    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      color: #4b5563;
    }
    .btn-move {
      display: inline-block;
      background: linear-gradient(90deg, #ec4899 25%, #d63384 50%, #ec4899 75%);
      background-size: 200% 100%;
      color: #fff;
      font-weight: 600;
      font-size: 1.15rem;
      padding: 0.85rem 2.5rem;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.5);
      transition: background-position 3s linear, background-color 0.3s ease,
        transform 0.25s ease;
    }
    .btn-move:hover {
      background-position: 100% 0;
      background-color: #c026d3;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container" role="main">
    <h1>Nexa Has Moved!</h1>
    <p>
      We’ve relocated our site to a new home to serve you better. Please visit our
      new platform to continue your journey with Nexa.
    </p>
    <a href="https://mynexa.pythonanywhere.com" class="btn-move" target="_blank" rel="noopener noreferrer" aria-label="Go to mynexa.pythonanywhere.com">
      Go to New Nexa Site
    </a>
  </div>
</body>
</html>
