<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jwt-simple/0.5.6/jwt-simple.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; display: flex; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; border: 1px solid #f9a8d4; text-align: center; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 to-white min-h-screen">
    <div class="flex">
        <div class="fixed top-0 left-0 h-full w-64 bg-white shadow-md p-6">
            <div class="flex items-center space-x-2 mb-8">
                <svg class="w-6 h-6" viewBox="0 0 50 50" fill="none">
                    <rect x="10" y="10" width="10" height="10" fill="#ec4899" rx="2"/>
                    <rect x="30" y="10" width="10" height="10" fill="#f9a8d4" rx="2"/>
                    <rect x="10" y="30" width="10" height="10" fill="#f9a8d4" rx="2"/>
                    <rect x="30" y="30" width="10" height="10" fill="#ec4899" rx="2"/>
                </svg>
                <h1 class="text-xl font-bold text-pink-600">NEXA</h1>
            </div>
            <nav class="space-y-4">
                <a href="#" class="block text-gray-600 hover:text-pink-600 font-medium">Admin</a>
                <a href="pricing.html" class="block text-gray-600 hover:text-pink-600 font-medium">Pricing</a>
                <button id="logout" class="block text-gray-600 hover:text-pink-600 font-medium">Logout</button>
            </nav>
        </div>
        <div class="flex-1 p-6 ml-64">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Admin Panel</h2>
            <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Add Contract</h3>
                <div class="space-y-4">
                    <input id="userEmail" type="email" placeholder="User Email" required class="w-full p-2 border border-pink-200 rounded-full">
                    <input id="accountSize" type="number" placeholder="Account Size" required class="w-full p-2 border border-pink-200 rounded-full">
                    <input id="challengeType" type="text" placeholder="Challenge Type" required class="w-full p-2 border border-pink-200 rounded-full">
                    <input id="contractStatus" type="text" placeholder="Contract Status" required class="w-full p-2 border border-pink-200 rounded-full">
                    <input id="kycStatus" type="text" placeholder="KYC Status" required class="w-full p-2 border border-pink-200 rounded-full">
                    <input id="contractExpiry" type="text" placeholder="Contract Expiry" required class="w-full p-2 border border-pink-200 rounded-full">
                    <input id="payoutDate" type="text" placeholder="Payout Date" required class="w-full p-2 border border-pink-200 rounded-full">
                    <button onclick="addContract()" class="w-full bg-pink-500 text-white p-2 rounded-full hover:bg-pink-600">Add Contract</button>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Contracts</h3>
                <input id="searchEmail" type="email" placeholder="Search by User Email" class="w-full p-2 border border-pink-200 rounded-full mb-4">
                <div id="contracts" class="space-y-4"></div>
            </div>
            <div class="bg-white rounded-2xl shadow-md p-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Send Notification</h3>
                <div class="space-y-4">
                    <input id="notifEmail" type="email" placeholder="User Email" required class="w-full p-2 border border-pink-200 rounded-full">
                    <textarea id="notifMessage" placeholder="Message" required class="w-full p-2 border border-pink-200 rounded-lg"></textarea>
                    <button onclick="sendNotification()" class="w-full bg-pink-500 text-white p-2 rounded-full hover:bg-pink-600">Send Notification</button>
                </div>
            </div>
        </div>
    </div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <p id="modal-message" class="text-gray-800 mb-4"></p>
            <button id="modal-close" class="bg-pink-500 text-white px-4 py-1 rounded-full hover:bg-pink-600">OK</button>
        </div>
    </div>
    <script>
        const JWT_SECRET = 'nexa_secure_2025';
        function initDataStore() {
            let dataStore = JSON.parse(localStorage.getItem('nexa_data')) || {
                users: [],
                contracts: [],
                notifications: []
            };
            if (!dataStore.users.find(u => u.email === 'infocontactnexa@gmail.com')) {
                dataStore.users.push({
                    email: 'infocontactnexa@gmail.com',
                    password: bcrypt.hashSync('NexaAdmin2025', 10),
                    name: 'Admin',
                    phone: '',
                    address: '',
                    isAdmin: true
                });
                localStorage.setItem('nexa_data', JSON.stringify(dataStore));
            }
            return dataStore;
        }
        function saveDataStore(dataStore) {
            localStorage.setItem('nexa_data', JSON.stringify(dataStore));
        }
        function showModal(message) {
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal').style.display = 'flex';
        }
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });
        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        });
        function loadAdmin() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                showModal('Please login');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                return;
            }
            let decoded;
            try {
                decoded = jwt.decode(token, JWT_SECRET);
            } catch (err) {
                showModal('Invalid token');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                return;
            }
            if (!decoded.isAdmin || decoded.email !== 'infocontactnexa@gmail.com') {
                showModal('Admin access required');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                return;
            }
            loadContracts();
        }
        function loadContracts(searchEmail = '') {
            const dataStore = initDataStore();
            const contractsDiv = document.getElementById('contracts');
            contractsDiv.innerHTML = '';
            const contracts = searchEmail ? dataStore.contracts.filter(c => c.userEmail === searchEmail) : dataStore.contracts;
            contracts.forEach(contract => {
                const div = document.createElement('div');
                div.className = 'border border-pink-200 rounded-lg p-4';
                div.innerHTML = `
                    <p><strong>ID:</strong> ${contract.id}</p>
                    <p><strong>User Email:</strong> ${contract.userEmail}</p>
                    <p><strong>Account Size:</strong> $${contract.accountSize}</p>
                    <p><strong>Challenge Type:</strong> ${contract.challengeType}</p>
                    <p><strong>Status:</strong> ${contract.contractStatus}</p>
                    <select onchange="updateKycStatus(${contract.id}, this.value)">
                        <option value="Not Submitted" ${contract.kycStatus === 'Not Submitted' ? 'selected' : ''}>Not Submitted</option>
                        <option value="Pending" ${contract.kycStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="Approved" ${contract.kycStatus === 'Approved' ? 'selected' : ''}>Approved</option>
                        <option value="Rejected" ${contract.kycStatus === 'Rejected' ? 'selected' : ''}>Rejected</option>
                    </select>
                    <button onclick="disableContract(${contract.id})" class="bg-red-500 text-white px-4 py-1 rounded-full mt-2">Disable</button>
                `;
                contractsDiv.appendChild(div);
            });
        }
        function updateKycStatus(contractId, kycStatus) {
            const dataStore = initDataStore();
            const contract = dataStore.contracts.find(c => c.id === contractId);
            if (contract) {
                contract.kycStatus = kycStatus;
                saveDataStore(dataStore);
                showModal('KYC status updated');
            }
        }
        function disableContract(contractId) {
            const dataStore = initDataStore();
            const contract = dataStore.contracts.find(c => c.id === contractId);
            if (contract) {
                contract.contractStatus = 'Disabled';
                saveDataStore(dataStore);
                showModal('Contract disabled');
                loadContracts(document.getElementById('searchEmail').value);
            }
        }
        function addContract() {
            const dataStore = initDataStore();
            const userEmail = document.getElementById('userEmail').value.trim();
            if (!dataStore.users.find(u => u.email === userEmail)) {
                showModal('User not found');
                return;
            }
            const contract = {
                id: dataStore.contracts.length + 1,
                userEmail,
                accountSize: parseInt(document.getElementById('accountSize').value),
                challengeType: document.getElementById('challengeType').value.trim(),
                contractStatus: document.getElementById('contractStatus').value.trim(),
                kycStatus: document.getElementById('kycStatus').value.trim(),
                contractExpiry: document.getElementById('contractExpiry').value.trim(),
                payoutDate: document.getElementById('payoutDate').value.trim()
            };
            dataStore.contracts.push(contract);
            saveDataStore(dataStore);
            showModal('Contract added');
            document.getElementById('userEmail').value = '';
            document.getElementById('accountSize').value = '';
            document.getElementById('challengeType').value = '';
            document.getElementById('contractStatus').value = '';
            document.getElementById('kycStatus').value = '';
            document.getElementById('contractExpiry').value = '';
            document.getElementById('payoutDate').value = '';
            loadContracts();
        }
        function sendNotification() {
            const dataStore = initDataStore();
            const userEmail = document.getElementById('notifEmail').value.trim();
            if (!dataStore.users.find(u => u.email === userEmail)) {
                showModal('User not found');
                return;
            }
            const notification = {
                id: dataStore.notifications.length + 1,
                userEmail,
                message: document.getElementById('notifMessage').value.trim(),
                createdAt: new Date().toISOString()
            };
            dataStore.notifications.push(notification);
            saveDataStore(dataStore);
            showModal('Notification sent');
            document.getElementById('notifEmail').value = '';
            document.getElementById('notifMessage').value = '';
        }
        document.getElementById('searchEmail').addEventListener('input', (e) => {
            loadContracts(e.target.value.trim());
        });
        loadAdmin();
    </script>
</body>
</html>
