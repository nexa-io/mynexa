<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Times New Roman', Times, serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="admin-login" class="flex items-center justify-center min-h-screen">
        <div class="max-w-md w-full mx-auto p-6 bg-white rounded shadow">
            <h2 class="text-2xl font-bold text-gray-800 text-center">Admin Login</h2>
            <form id="admin-form" class="mt-6 space-y-4">
                <div>
                    <label class="block text-gray-600">Email</label>
                    <input type="email" id="admin-email" class="w-full p-2 border rounded" value="infocontactnexa@gmail.com" required>
                </div>
                <div>
                    <label class="block text-gray-600">Password</label>
                    <input type="password" id="admin-password" class="w-full p-2 border rounded" required>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Log In</button>
            </form>
        </div>
    </div>
    <div id="admin-dashboard" class="hidden">
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <h1 class="text-3xl font-bold text-blue-600">Admin Dashboard</h1>
                <button id="admin-logout" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Log Out</button>
            </div>
        </header>
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <h2 class="text-2xl font-bold text-gray-800">Users</h2>
            <table id="users-table" class="mt-6 w-full bg-white rounded shadow">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="p-2 text-left">User ID</th>
                        <th class="p-2 text-left">Name</th>
                        <th class="p-2 text-left">Email</th>
                        <th class="p-2 text-left">KYC Status</th>
                        <th class="p-2 text-left">Contract Status</th>
                        <th class="p-2 text-left">Account Size</th>
                        <th class="p-2 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                </tbody>
            </table>
        </main>
    </div>
    <script>
        const adminForm = document.getElementById('admin-form');
        const adminLogin = document.getElementById('admin-login');
        const adminDashboard = document.getElementById('admin-dashboard');
        const adminLogout = document.getElementById('admin-logout');
        const usersTbody = document.getElementById('users-tbody');
        const ADMIN_EMAIL = 'infocontactnexa@gmail.com';
        const ADMIN_PASSWORD = 'admin123'; // Change this in production
        adminForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                adminLogin.style.display = 'none';
                adminDashboard.classList.remove('hidden');
                loadUsers();
            } else {
                alert('Invalid admin credentials.');
            }
        });
        adminLogout.addEventListener('click', () => {
            adminDashboard.classList.add('hidden');
            adminLogin.style.display = 'flex';
            document.getElementById('admin-email').value = '';
            document.getElementById('admin-password').value = '';
        });
        async function loadUsers() {
            const response = await fetch('https://nexa-backend-3wxt.onrender.com/admin/users', {
                method: 'GET',
                headers: { 'Authorization': 'Basic ' + btoa(ADMIN_EMAIL + ':' + ADMIN_PASSWORD) }
            });
            if (response.ok) {
                const users = await response.json();
                usersTbody.innerHTML = users.map(user => `
                    <tr>
                        <td class="p-2">${user.userId}</td>
                        <td class="p-2">${user.name}</td>
                        <td class="p-2">${user.email}</td>
                        <td class="p-2">${user.kycStatus}</td>
                        <td class="p-2">${user.contractStatus}</td>
                        <td class="p-2">$${user.accountSize}</td>
                        <td class="p-2">
                            <button onclick="updateStatus('${user.userId}', 'kycStatus', 'Verified')" class="bg-green-500 text-white px-2 py-1 rounded mr-1">Verify KYC</button>
                            <button onclick="updateStatus('${user.userId}', 'contractStatus', 'Signed')" class="bg-green-500 text-white px-2 py-1 rounded mr-1">Sign Contract</button>
                            <button onclick="updateStatus('${user.userId}', 'payoutStatus', 'Paid')" class="bg-green-500 text-white px-2 py-1 rounded">Pay Payout</button>
                        </td>
                    </tr>
                `).join('');
            }
        }
        async function updateStatus(userId, field, value) {
            const response = await fetch('https://nexa-backend-3wxt.onrender.com/admin/update', {
                method: 'POST',
                headers: { 'Authorization': 'Basic ' + btoa(ADMIN_EMAIL + ':' + ADMIN_PASSWORD), 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, [field]: value })
            });
            if (response.ok) {
                loadUsers();
            }
        }
    </script>
</body>
</html>
