<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Nexa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to bottom right, #fce7f3, #fff);
            margin: 0;
            min-height: 100vh;
        }
        .flex {
            display: flex;
        }
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            width: 16rem;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 1.5rem;
        }
        .sidebar svg rect {
            rx: 2;
        }
        .sidebar h1 {
            color: #db2777;
            font-weight: 700;
            font-size: 1.25rem;
            margin-left: 0.5rem;
        }
        .nav-links {
            margin-top: 2rem;
        }
        .nav-links a,
        .nav-links button {
            display: block;
            margin-bottom: 1rem;
            color: #4b5563;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            padding: 0;
        }
        .nav-links a:hover,
        .nav-links button:hover {
            color: #db2777;
        }
        main {
            margin-left: 16rem;
            padding: 1.5rem;
            flex: 1;
        }
        .card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        h2, h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #1f2937;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #f9a8d4;
            border-radius: 9999px;
            margin-bottom: 1rem;
            font-family: inherit;
        }
        textarea {
            border-radius: 0.5rem;
            resize: vertical;
        }
        button {
            background: #db2777;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #be185d;
        }
        .contract {
            border: 1px solid #f9a8d4;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
            color: #374151;
        }
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #modal .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            max-width: 400px;
            width: 90%;
            border: 1px solid #f9a8d4;
            text-align: center;
        }
        #modal-close {
            background: #db2777;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
        }
        #modal-close:hover {
            background: #be185d;
        }
    </style>
</head>
<body>
    <div class="flex">
        <aside class="sidebar">
            <div class="logo flex items-center space-x-2">
                <svg width="24" height="24" viewBox="0 0 50 50" fill="none">
                    <rect x="10" y="10" width="10" height="10" fill="#ec4899" rx="2"></rect>
                    <rect x="30" y="10" width="10" height="10" fill="#f9a8d4" rx="2"></rect>
                    <rect x="10" y="30" width="10" height="10" fill="#f9a8d4" rx="2"></rect>
                    <rect x="30" y="30" width="10" height="10" fill="#ec4899" rx="2"></rect>
                </svg>
                <h1>NEXA</h1>
            </div>
            <nav class="nav-links">
                <a href="#" aria-current="page">Admin</a>
                <a href="pricing.html">Pricing</a>
                <button id="logout">Logout</button>
            </nav>
        </aside>
        <main>
            <h2>Admin Panel</h2>

            <section class="card">
                <h3>Add Contract</h3>
                <input id="userEmail" type="email" placeholder="User Email" required />
                <input id="accountSize" type="number" placeholder="Account Size" required />
                <input id="challengeType" type="text" placeholder="Challenge Type" required />
                <input id="contractStatus" type="text" placeholder="Contract Status" required />
                <input id="kycStatus" type="text" placeholder="KYC Status" required />
                <input id="contractExpiry" type="text" placeholder="Contract Expiry" required />
                <input id="payoutDate" type="text" placeholder="Payout Date" required />
                <button onclick="addContract()">Add Contract</button>
            </section>

            <section class="card">
                <h3>Contracts</h3>
                <input id="searchEmail" type="email" placeholder="Search by User Email" />
                <div id="contracts"></div>
            </section>

            <section class="card">
                <h3>Send Notification</h3>
                <input id="notifEmail" type="email" placeholder="User Email" required />
                <textarea id="notifMessage" placeholder="Message" required></textarea>
                <button onclick="sendNotification()">Send Notification</button>
            </section>
        </main>
    </div>

    <div id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-message">
        <div class="modal-content">
            <p id="modal-message"></p>
            <button id="modal-close">OK</button>
        </div>
    </div>

    <script>
        // Simple JWT encode/decode simulation (no signature)
        function encodeJWT(payload) {
            return btoa(JSON.stringify(payload));
        }
        function decodeJWT(token) {
            try {
                return JSON.parse(atob(token));
            } catch {
                return null;
            }
        }

        function simpleHash(text) {
            let hash = 0;
            for(let i=0; i < text.length; i++) {
                hash = ((hash << 5) - hash) + text.charCodeAt(i);
                hash |= 0;
            }
            return hash.toString();
        }

        function initDataStore() {
            let dataStore = JSON.parse(localStorage.getItem('nexa_data')) || {
                users: [],
                contracts: [],
                notifications: []
            };
            if (!dataStore.users.find(u => u.email === 'infocontactnexa@gmail.com')) {
                dataStore.users.push({
                    email: 'infocontactnexa@gmail.com',
                    password: simpleHash('Strika001$'),
                    name: 'Admin',
                    phone: '',
                    address: '',
                    isAdmin: true
                });
                localStorage.setItem('nexa_data', JSON.stringify(dataStore));
            }
            return dataStore;
        }
        function saveDataStore(dataStore) {
            localStorage.setItem('nexa_data', JSON.stringify(dataStore));
        }

        function showModal(message) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-message').innerText = message;
            modal.style.display = 'flex';
        }
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });

        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        });

        function loadAdmin() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                showModal('Please login');
                setTimeout(() => window.location.href = 'login.html', 2000);
                return;
            }

            const decoded = decodeJWT(token);
            if (!decoded || !decoded.email) {
                showModal('Invalid token');
                setTimeout(() => window.location.href = 'login.html', 2000);
                return;
            }

            if (!decoded.isAdmin || decoded.email !== 'infocontactnexa@gmail.com') {
                showModal('Admin access required');
                setTimeout(() => window.location.href = 'login.html', 2000);
                return;
            }

            loadContracts();
        }

        // Load contracts optionally filtered by user email
        function loadContracts(searchEmail = '') {
            const dataStore = initDataStore();
            const contractsDiv = document.getElementById('contracts');
            contractsDiv.innerHTML = '';

            const filteredContracts = searchEmail ? dataStore.contracts.filter(c => c.userEmail.toLowerCase() === searchEmail.toLowerCase()) : dataStore.contracts;

            filteredContracts.forEach(contract => {
                const div = document.createElement('div');
                div.className = 'contract';
                div.innerHTML = `
                    <p><strong>ID:</strong> ${contract.id}</p>
                    <p><strong>User Email:</strong> ${contract.userEmail}</p>
                    <p><strong>Account Size:</strong> $${contract.accountSize}</p>
                    <p><strong>Challenge Type:</strong> ${contract.challengeType}</p>
                    <p><strong>Status:</strong> ${contract.contractStatus}</p>
                    <select onchange="updateKycStatus(${contract.id}, this.value)">
                        <option value="Not Submitted" ${contract.kycStatus === 'Not Submitted' ? 'selected' : ''}>Not Submitted</option>
                        <option value="Pending" ${contract.kycStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="Approved" ${contract.kycStatus === 'Approved' ? 'selected' : ''}>Approved</option>
                        <option value="Rejected" ${contract.kycStatus === 'Rejected' ? 'selected' : ''}>Rejected</option>
                    </select>
                    <button onclick="disableContract(${contract.id})">Disable</button>
                `;
                contractsDiv.appendChild(div);
            });
        }

        function updateKycStatus(contractId, kycStatus) {
            const dataStore = initDataStore();
            const contract = dataStore.contracts.find(c => c.id === contractId);
            if (contract) {
                contract.kycStatus = kycStatus;
                saveDataStore(dataStore);
                showModal('KYC status updated');
            }
        }

        function disableContract(contractId) {
            const dataStore = initDataStore();
            const contract = dataStore.contracts.find(c => c.id === contractId);
            if (contract) {
                contract.contractStatus = 'Disabled';
                saveDataStore(dataStore);
                showModal('Contract disabled');
                loadContracts(document.getElementById('searchEmail').value.trim());
            }
        }

        function addContract() {
            const dataStore = initDataStore();
            const userEmail = document.getElementById('userEmail').value.trim();
            if (!dataStore.users.find(u => u.email.toLowerCase() === userEmail.toLowerCase())) {
                showModal('User not found');
                return;
            }
            const accountSize = parseInt(document.getElementById('accountSize').value);
            if (isNaN(accountSize)) {
                showModal('Invalid account size');
                return;
            }
            const contract = {
                id: dataStore.contracts.length + 1,
                userEmail,
                accountSize,
                challengeType: document.getElementById('challengeType').value.trim(),
                contractStatus: document.getElementById('contractStatus').value.trim(),
                kycStatus: document.getElementById('kycStatus').value.trim(),
                contractExpiry: document.getElementById('contractExpiry').value.trim(),
                payoutDate: document.getElementById('payoutDate').value.trim()
            };
            dataStore.contracts.push(contract);
            saveDataStore(dataStore);
            showModal('Contract added');
            document.getElementById('userEmail').value = '';
            document.getElementById('accountSize').value = '';
            document.getElementById('challengeType').value = '';
            document.getElementById('contractStatus').value = '';
            document.getElementById('kycStatus').value = '';
            document.getElementById('contractExpiry').value = '';
            document.getElementById('payoutDate').value = '';
            loadContracts();
        }

        function sendNotification() {
            const dataStore = initDataStore();
            const userEmail = document.getElementById('notifEmail').value.trim();
            if (!dataStore.users.find(u => u.email.toLowerCase() === userEmail.toLowerCase())) {
                showModal('User not found');
                return;
            }
            const message = document.getElementById('notifMessage').value.trim();
            if (!message) {
                showModal('Message cannot be empty');
                return;
            }
            const notification = {
                id: dataStore.notifications.length + 1,
                userEmail,
                message,
                createdAt: new Date().toISOString()
            };
            dataStore.notifications.push(notification);
            saveDataStore(dataStore);
            showModal('Notification sent');
            document.getElementById('notifEmail').value = '';
            document.getElementById('notifMessage').value = '';
        }

        document.getElementById('searchEmail').addEventListener('input', e => {
            loadContracts(e.target.value.trim());
        });

        loadAdmin();
    </script>
</body>
</html>
