<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Times New Roman', Times, serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto p-6 bg-white rounded shadow">
        <h2 class="text-2xl font-bold text-gray-800 text-center">Sign Up</h2>
        <p class="text-gray-600 text-center mt-2">Join Nexa to start trading.</p>
        <form id="signup-form" class="mt-6 space-y-4">
            <div>
                <label class="block text-gray-600">Full Name</label>
                <input type="text" id="name" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-gray-600">Email</label>
                <input type="email" id="email" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-gray-600">Password</label>
                <input type="password" id="password" class="w-full p-2 border rounded" required>
            </div>
            <div class="flex items-center">
                <input type="checkbox" id="terms" class="mr-2">
                <label for="terms" class="text-gray-600">I accept the <a href="terms.html" class="text-blue-500 hover:underline">Terms</a> and <a href="privacy.html" class="text-blue-500 hover:underline">Privacy Policy</a>.</label>
            </div>
            <button type="submit" id="signup-btn" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 disabled:bg-gray-400" disabled>Sign Up</button>
        </form>
        <p class="mt-4 text-center text-gray-600">Already have an account? <a href="login.html" class="text-blue-500 hover:underline">Log In</a></p>
    </div>
    <script>
        const terms = document.getElementById('terms');
        const signupBtn = document.getElementById('signup-btn');
        terms.addEventListener('change', () => {
            signupBtn.disabled = !terms.checked;
        });
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            const response = await fetch('https://nexa-backend-3wxt.onrender.com/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });
            if (response.ok) {
                localStorage.setItem('user', JSON.stringify(await response.json()));
                localStorage.setItem('loggedIn', 'true');
                alert('Signup successful! Check your email for contract and KYC links.');
                window.location.href = 'dashboard.html';
            } else {
                alert('Signup failed.');
            }
        });
    </script>
</body>
</html>
