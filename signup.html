<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up - Nexa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to bottom right, #fce7f3, #fff);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        main {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #db2777;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        input[type="email"],
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #f9a8d4;
            border-radius: 9999px;
            margin-bottom: 1rem;
            font-family: inherit;
        }
        button {
            background: #db2777;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-bottom: 1rem;
        }
        button:hover {
            background: #be185d;
        }
        p {
            font-size: 0.9rem;
            color: #555;
        }
        a {
            color: #db2777;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        a:hover {
            text-decoration: underline;
        }
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #modal .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            max-width: 300px;
            width: 90%;
            border: 1px solid #f9a8d4;
            text-align: center;
        }
        #modal-close {
            background: #db2777;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
        }
        #modal-close:hover {
            background: #be185d;
        }
    </style>
</head>
<body>
    <main>
        <h1>Create an Account</h1>
        <input id="name" type="text" placeholder="Full Name" required autocomplete="name" />
        <input id="email" type="email" placeholder="Email" required autocomplete="email" />
        <input id="password" type="password" placeholder="Password" required autocomplete="new-password" />
        <input id="confirmPassword" type="password" placeholder="Confirm Password" required autocomplete="new-password" />
        <button id="signupBtn">Sign Up</button>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </main>

    <div id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-message">
        <div class="modal-content">
            <p id="modal-message"></p>
            <button id="modal-close">OK</button>
        </div>
    </div>

    <script>
        function simpleHash(text) {
            let hash = 0;
            for(let i=0; i < text.length; i++) {
                hash = ((hash << 5) - hash) + text.charCodeAt(i);
                hash |= 0;
            }
            return hash.toString();
        }
        function initDataStore() {
            return JSON.parse(localStorage.getItem('nexa_data')) || {
                users: [],
                contracts: [],
                notifications: []
            };
        }
        function saveDataStore(dataStore) {
            localStorage.setItem('nexa_data', JSON.stringify(dataStore));
        }
        function showModal(message) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-message').innerText = message;
            modal.style.display = 'flex';
        }
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });

        document.getElementById('signupBtn').addEventListener('click', () => {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!name || !email || !password || !confirmPassword) {
                showModal('Please fill in all fields');
                return;
            }
            if (password !== confirmPassword) {
                showModal('Passwords do not match');
                return;
            }
            const dataStore = initDataStore();
            if (dataStore.users.find(u => u.email.toLowerCase() === email)) {
                showModal('User already exists');
                return;
            }
            const newUser = {
                email,
                password: simpleHash(password),
                name,
                phone: '',
                address: '',
                isAdmin: false
            };
            dataStore.users.push(newUser);
            saveDataStore(dataStore);

            showModal('Account created successfully! Redirecting to login...');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });
    </script>
</body>
</html>
