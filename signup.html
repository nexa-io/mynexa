<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up - Nexa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Montserrat', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-auto p-8 bg-white rounded-xl shadow-2xl border border-pink-100">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Join Nexa</h2>
    <p class="text-gray-600 text-center mb-6">Start your profit-sharing journey.</p>

    <form id="signupForm" class="space-y-4" novalidate>
      <div>
        <label class="block text-sm text-gray-700">Full name</label>
        <input id="name" required class="w-full p-3 border rounded" />
      </div>
      <div>
        <label class="block text-sm text-gray-700">Email</label>
        <input id="email" type="email" required class="w-full p-3 border rounded" />
      </div>
      <div>
        <label class="block text-sm text-gray-700">Password</label>
        <input id="password" type="password" required class="w-full p-3 border rounded" />
      </div>
      <div>
        <label class="block text-sm text-gray-700">Phone (optional)</label>
        <input id="phone" type="tel" class="w-full p-3 border rounded" />
      </div>
      <div>
        <label class="block text-sm text-gray-700">Address (optional)</label>
        <input id="address" class="w-full p-3 border rounded" />
      </div>

      <div class="flex items-center">
        <input id="terms" type="checkbox" class="mr-2" />
        <label class="text-sm text-gray-600">I accept the <a href="terms.html" class="text-pink-500">Terms</a> and <a href="privacy.html" class="text-pink-500">Privacy Policy</a>.</label>
      </div>

      <button id="signupBtn" type="submit" disabled class="w-full bg-pink-500 text-white p-3 rounded">Create Account</button>
    </form>

    <p class="mt-4 text-center text-sm">Already have an account? <a href="login.html" class="text-pink-500">Log in</a></p>
  </div>

  <script>
    const backendUrl = location.origin; // if served from same host; otherwise set full URL
    // Example: const backendUrl = 'https://nexa-backend-3wxt.onrender.com';

    const form = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const terms = document.getElementById('terms');

    terms.addEventListener('change', () => signupBtn.disabled = !terms.checked);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      signupBtn.disabled = true;
      signupBtn.textContent = 'Processing...';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();

      if (!name || !email || !password) {
        alert('Please fill all required fields.');
        signupBtn.disabled = !terms.checked;
        signupBtn.textContent = 'Create Account';
        return;
      }

      try {
        const resp = await fetch(`${backendUrl}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, phone, address })
        });

        const data = await resp.json();
        if (!resp.ok) {
          alert(data.message || 'Signup failed.');
          return;
        }

        // Save token and user
        if (data.token) localStorage.setItem('authToken', data.token);
        if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('loggedIn', 'true');

        alert('Signup successful! Redirecting to dashboard...');
        window.location.href = 'dashboard.html';
      } catch (err) {
        console.error('Signup error:', err);
        alert('Network error. Please try again.');
      } finally {
        signupBtn.textContent = 'Create Account';
        signupBtn.disabled = !terms.checked;
      }
    });
  </script>
</body>
</html>
