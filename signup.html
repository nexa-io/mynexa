<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign Up - Nexa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow">
    <h2 class="text-2xl font-bold mb-4 text-center">Create Account</h2>
    <form id="signupForm" class="space-y-4">
      <input id="name" type="text" placeholder="Full Name" required class="w-full p-3 border rounded"/>
      <input id="email" type="email" placeholder="Email" required class="w-full p-3 border rounded"/>
      <input id="password" type="password" placeholder="Password" required class="w-full p-3 border rounded"/>
      <button type="submit" id="signupBtn" class="w-full bg-pink-500 text-white p-3 rounded">Sign Up</button>
    </form>
    <p class="mt-4 text-center text-sm">Already have an account? <a href="login.html" class="text-pink-500">Login</a></p>
  </div>

  <script>
    const backendUrl = 'https://<YOUR-RENDER-BACKEND-URL>'; // 🌐 LIVE backend

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      btn.disabled = true;
      btn.textContent = 'Signing up...';

      const user = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch(`${backendUrl}/signup`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(user)
        });
        const data = await res.json();
        if (!res.ok) return alert(data.message || 'Signup failed');

        localStorage.setItem('authToken', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('loggedIn', 'true');
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert('Network error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
