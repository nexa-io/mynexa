<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Nexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Montserrat', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full mx-auto p-8 bg-white rounded-xl shadow-2xl border border-pink-100">
        <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Join Nexa</h2>
        <p class="text-gray-600 text-center mb-6">Join Nexa — start your profit-sharing journey.</p>

        <form id="signup-form" class="mt-6 space-y-5">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" required>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" required>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" required>
            </div>
            <div class="flex items-center">
                <input type="checkbox" id="terms" class="mr-2 h-4 w-4 text-pink-600 border-gray-300 rounded focus:ring-pink-500">
                <label for="terms" class="text-sm text-gray-600">
                    I accept the 
                    <a href="terms.html" class="text-pink-500 hover:text-pink-600 hover:underline">Terms</a> 
                    and 
                    <a href="privacy.html" class="text-pink-500 hover:text-pink-600 hover:underline">Privacy Policy</a>.
                </label>
            </div>
            <button type="submit" id="signup-btn" class="w-full bg-pink-500 text-white p-3 rounded-lg font-semibold hover:bg-pink-600 transition-colors disabled:bg-gray-400" disabled>
                Create Account
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            Already have an account? 
            <a href="login.html" class="text-pink-500 hover:text-pink-600 hover:underline font-medium">Log In</a>
        </p>
    </div>

    <script>
        // Redirect if already logged in
        if (localStorage.getItem('loggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }

        const terms = document.getElementById('terms');
        const signupBtn = document.getElementById('signup-btn');
        terms.addEventListener('change', () => {
            signupBtn.disabled = !terms.checked;
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            signupBtn.textContent = 'Processing...';
            signupBtn.disabled = true;

            const newUser = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('https://nexa-backend-3wxt.onrender.com/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newUser)
                });

                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 409) {
                        alert('This email is already registered. Please log in.');
                    } else if (response.status === 400) {
                        alert(data.message || 'Invalid input. Please check your details.');
                    } else {
                        alert('Signup failed. Please try again later.');
                    }
                    return;
                }

                if (data.token) {
                    localStorage.setItem('authToken', data.token);
                }
                localStorage.setItem('loggedIn', 'true');

                alert('Signup successful! A contract and KYC link has been sent to your email.');
                window.location.href = 'dashboard.html';

            } catch (error) {
                console.error('Signup error:', error);
                alert('An unexpected error occurred. Please try again later.');
            } finally {
                signupBtn.textContent = 'Create Account';
                signupBtn.disabled = !terms.checked;
            }
        });
    </script>
</body>
</html>
