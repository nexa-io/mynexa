<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Nexa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Montserrat', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full mx-auto p-8 bg-white rounded-xl shadow-2xl border border-pink-100">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Join Nexa</h2>
    <p class="text-gray-600 text-center mb-6">Start your profit-sharing journey today.</p>

    <!-- ✅ Correct form structure -->
    <form id="signupForm" class="mt-6 space-y-5" novalidate>
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" id="name" required
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" required
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" required
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500" />
      </div>
      <div class="flex items-center">
        <input type="checkbox" id="terms" class="mr-2 h-4 w-4 text-pink-600 border-gray-300 rounded focus:ring-pink-500">
        <label for="terms" class="text-sm text-gray-600">
          I accept the 
          <a href="terms.html" class="text-pink-500 hover:underline">Terms</a> 
          and 
          <a href="privacy.html" class="text-pink-500 hover:underline">Privacy Policy</a>.
        </label>
      </div>
      <button type="submit" id="signupBtn"
        class="w-full bg-pink-500 text-white p-3 rounded-lg font-semibold hover:bg-pink-600 transition-colors disabled:bg-gray-400"
        disabled>
        Create Account
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      Already have an account? 
      <a href="login.html" class="text-pink-500 hover:underline font-medium">Log In</a>
    </p>
  </div>

  <script>
    const backendUrl = 'https://nexa-backend-3wxt.onrender.com';
    const form = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const terms = document.getElementById('terms');

    // Redirect if already logged in
    if (localStorage.getItem('loggedIn') === 'true') {
      window.location.href = 'dashboard.html';
    }

    // Enable button when terms checked
    terms.addEventListener('change', () => {
      signupBtn.disabled = !terms.checked;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // ✅ prevent accidental GET

      signupBtn.disabled = true;
      signupBtn.textContent = 'Signing up...';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!name || !email || !password) {
        alert('Please fill in all fields.');
        signupBtn.disabled = !terms.checked;
        signupBtn.textContent = 'Create Account';
        return;
      }

      try {
        const response = await fetch(`${backendUrl}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.token) {
            localStorage.setItem('authToken', data.token);
          }
          localStorage.setItem('loggedIn', 'true');
          alert('Signup successful! Check your email for KYC and contract.');
          window.location.href = 'dashboard.html';
        } else {
          if (response.status === 409) {
            alert('This email is already registered. Please log in.');
          } else if (response.status === 400) {
            alert(data.message || 'Invalid input. Please check your details.');
          } else {
            alert('Signup failed. Please try again.');
          }
        }
      } catch (err) {
        console.error('Signup error:', err);
        alert('Network error. Please check your connection.');
      } finally {
        signupBtn.textContent = 'Create Account';
        signupBtn.disabled = !terms.checked;
      }
    });
  </script>
</body>
</html>
