<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login - Nexa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(to bottom right, #fce7f3, #fff);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4b5563;
  }
  main {
    background: white;
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 4px 20px rgba(219, 39, 119, 0.15);
    width: 320px;
    text-align: center;
  }
  h1 {
    color: #db2777;
    font-weight: 700;
    margin-bottom: 1.5rem;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 0.6rem;
    margin-bottom: 1rem;
    border: 1px solid #f9a8d4;
    border-radius: 9999px;
    font-family: inherit;
    font-size: 1rem;
  }
  button {
    background: #db2777;
    color: white;
    border: none;
    padding: 0.6rem 0;
    border-radius: 9999px;
    font-weight: 700;
    font-size: 1rem;
    width: 100%;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  button:hover {
    background: #be185d;
  }
  #modal {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 1200;
    justify-content: center;
    align-items: center;
  }
  #modal .modal-content {
    background: white;
    max-width: 300px;
    width: 90%;
    padding: 1.5rem;
    border-radius: 1rem;
    border: 1px solid #f9a8d4;
    text-align: center;
    font-weight: 600;
    color: #db2777;
  }
  #modal-close {
    margin-top: 1rem;
    background: #db2777;
    border: none;
    color: white;
    padding: 0.5rem 1.5rem;
    border-radius: 9999px;
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    transition: background-color 0.2s ease;
  }
  #modal-close:hover {
    background: #be185d;
  }
</style>
</head>
<body>
<main>
  <h1>Admin Login</h1>
  <input id="email" type="email" placeholder="Admin Email" required autocomplete="username" />
  <input id="password" type="password" placeholder="Password" required autocomplete="current-password" />
  <button id="loginBtn">Log In</button>
</main>

<div id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-message" hidden>
  <div class="modal-content">
    <p id="modal-message"></p>
    <button id="modal-close" aria-label="Close message dialog">OK</button>
  </div>
</div>

<script>
function simpleHash(text) {
  let hash = 0;
  for(let i=0; i < text.length; i++) {
    hash = ((hash << 5) - hash) + text.charCodeAt(i);
    hash |= 0;
  }
  return hash.toString();
}
function encodeJWT(payload) {
  return btoa(JSON.stringify(payload));
}
function showModal(message) {
  const modal = document.getElementById('modal');
  const messageElem = document.getElementById('modal-message');
  messageElem.textContent = message;
  modal.hidden = false;
  modal.style.display = 'flex';
}
function hideModal() {
  const modal = document.getElementById('modal');
  modal.hidden = true;
  modal.style.display = 'none';
}
document.getElementById('modal-close').addEventListener('click', hideModal);

document.getElementById('loginBtn').addEventListener('click', () => {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  // Hardcoded admin credentials (email and password)
  const adminEmail = 'infocontactnexa@gmail.com';
  const adminPasswordHash = simpleHash('Strika001$');

  if (!email || !password) {
    showModal('Please enter email and password.');
    return;
  }

  if (email !== adminEmail) {
    showModal('Admin not found.');
    return;
  }
  if (simpleHash(password) !== adminPasswordHash) {
    showModal('Incorrect password.');
    return;
  }
  const token = encodeJWT({email: adminEmail, isAdmin: true});
  localStorage.setItem('authToken', token);
  window.location.href = 'admin.html';
});

// Prevent empty modal on load
window.addEventListener('load', () => {
  hideModal();
});
</script>
</body>
</html>
